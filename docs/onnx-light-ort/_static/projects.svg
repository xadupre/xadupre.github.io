<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="group" aria-labelledby="title description">
  <title id="title">Four bridges inside onnx-light-ort</title>
  <desc id="description">Custom operators and execution providers connect onnx-light and ONNX Runtime in both directions. Both custom-op bridges are implemented. Both execution-provider bridges are planned.</desc>
  <style>
    svg {
      --background: #f8fafc;
      --heading: #0f172a;
      --text: #334155;
      --ops-fill: #dbeafe;
      --ops-stroke: #2563eb;
      --ep-fill: #f3e8ff;
      --ep-stroke: #9333ea;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --background: #0f172a;
        --heading: #f8fafc;
        --text: #cbd5e1;
        --ops-fill: #172554;
        --ops-stroke: #60a5fa;
        --ep-fill: #3b0764;
        --ep-stroke: #c084fc;
      }
    }
    .background { fill: var(--background); }
    .heading { fill: var(--heading); }
    .text { fill: var(--text); }
    .ops { fill: var(--ops-fill); stroke: var(--ops-stroke); }
    .ep { fill: var(--ep-fill); stroke: var(--ep-stroke); }
    .zone rect { fill: transparent; }
    .zone:hover rect, .zone:focus rect {
      stroke: var(--heading);
      stroke-width: 3;
    }
  </style>
  <rect class="background" width="960" height="390" rx="16"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text class="heading" x="480" y="37" font-size="24" font-weight="bold">onnx-light-ort</text>
    <g class="text" font-size="18">
      <text x="250" y="75">ONNX Runtime calls onnx-light</text>
      <text x="710" y="75">onnx-light calls ORT-compatible libraries</text>
    </g>
    <g stroke-width="2">
      <rect class="ops" x="30" y="95" width="440" height="125" rx="12"/>
      <rect class="ops" x="490" y="95" width="440" height="125" rx="12"/>
      <rect class="ep" x="30" y="240" width="440" height="125" rx="12" stroke-dasharray="6 4"/>
      <rect class="ep" x="490" y="240" width="440" height="125" rx="12" stroke-dasharray="6 4"/>
    </g>
    <g class="heading" font-size="17" font-weight="bold">
      <text x="250" y="128">bridge_ops_light_called_by_ort</text>
      <text x="710" y="128">bridge_ops_ort_called_by_light</text>
      <text x="250" y="273">bridge_ep_light_called_by_ort</text>
      <text x="710" y="273">bridge_ep_ort_called_by_light</text>
    </g>
    <g class="text" font-size="16">
      <text x="250" y="162">Run onnx-light kernels as ORT custom ops</text>
      <text x="710" y="162">Host ORT custom-op libraries in onnx-light</text>
      <text x="250" y="198">Custom operators · implemented</text>
      <text x="710" y="198">Custom operators · implemented</text>
      <text x="250" y="307">Expose onnx-light as an ORT provider</text>
      <text x="710" y="307">Host ORT-compatible providers in onnx-light</text>
      <text x="250" y="343">Execution providers · planned</text>
      <text x="710" y="343">Execution providers · planned</text>
    </g>
  </g>
  <a class="zone" href="../components/bridge_ops_light_called_by_ort.html" target="_top" aria-label="onnx-light custom operators called by ORT">
    <rect x="30" y="95" width="440" height="125" rx="12"/>
  </a>
  <a class="zone" href="../components/bridge_ops_ort_called_by_light.html" target="_top" aria-label="ORT custom operators called by onnx-light">
    <rect x="490" y="95" width="440" height="125" rx="12"/>
  </a>
  <a class="zone" href="../components/bridge_ep_light_called_by_ort.html" target="_top" aria-label="onnx-light execution provider called by ORT (planned)">
    <rect x="30" y="240" width="440" height="125" rx="12"/>
  </a>
  <a class="zone" href="../components/bridge_ep_ort_called_by_light.html" target="_top" aria-label="ORT execution providers called by onnx-light (planned)">
    <rect x="490" y="240" width="440" height="125" rx="12"/>
  </a>
</svg>
