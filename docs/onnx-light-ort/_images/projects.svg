<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">The onnx-light projects</title>
  <desc id="description">onnx-light provides ONNX model tools and a reference runtime. onnx-light-cpu supplies optimized CPU kernels. onnx-light-ort provides bidirectional custom-op interoperability with ONNX Runtime, with execution providers planned. onnx-light-viewer explores ONNX graphs in VS Code.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="16" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M165 240V175H370V130"/>
    <path d="M480 240V130" marker-start="url(#arrow)"/>
    <path d="M590 130V175H795V240"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <g font-size="14" fill="#334155">
      <text x="245" y="165">CPU kernels</text>
      <text x="495" y="202" text-anchor="start">Custom-op interop</text>
      <text x="715" y="165">ONNX graphs</text>
    </g>
    <g stroke-width="2">
      <rect x="290" y="20" width="380" height="110" rx="12" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="20" y="240" width="290" height="100" rx="12" fill="#dcfce7" stroke="#15803d"/>
      <rect x="335" y="240" width="290" height="100" rx="12" fill="#f3e8ff" stroke="#9333ea"/>
      <rect x="650" y="240" width="290" height="100" rx="12" fill="#ffedd5" stroke="#c2410c"/>
    </g>
    <g font-size="21" font-weight="bold" fill="#0f172a">
      <text x="480" y="53">onnx-light</text>
      <text x="165" y="270">onnx-light-cpu</text>
      <text x="480" y="270">onnx-light-ort</text>
      <text x="795" y="270">onnx-light-viewer</text>
    </g>
    <g font-size="15" fill="#1e293b">
      <text x="480" y="82">ONNX models without protobuf</text>
      <text x="480" y="107">Model tools and reference runtime</text>
      <text x="165" y="298">Optimized native CPU kernels</text>
      <text x="165" y="322">SIMD computation</text>
      <text x="480" y="298">Bridge to / from ONNX Runtime</text>
      <text x="480" y="322">Custom ops now; EPs planned</text>
      <text x="795" y="298">Interactive ONNX graph explorer</text>
      <text x="795" y="322">Visualization in VS Code</text>
    </g>
  </g>
</svg>
