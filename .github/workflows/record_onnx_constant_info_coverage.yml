name: DATA onnx-light constant information coverage

# Weekly job that runs the backend tests tagged ``constant`` bundled with
# ``onnx-light`` and compares the metadata produced by the current
# constant-information analysis against the metadata embedded in those tests.
# The resulting JSON cache is written to
# ``cache_data/onnx-light/constant_info_coverage.json`` and consumed by
# ``dashboard/onnx-light/constant-info-coverage.html``.

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v6
        with:
          repository: xadupre/cache_data
          path: cache_data
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Checkout onnx-light
        uses: actions/checkout@v6
        with:
          repository: xadupre/onnx-light
          path: onnx-light

      - name: Detect CPU cores
        run: |
          cores="$(nproc)"
          echo "Detected ${cores} CPU cores."
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${cores}" >> "$GITHUB_ENV"

      - name: Install onnx and onnx-light
        run: |
          python -m pip install --upgrade pip
          pip install onnx numpy scikit-build-core nanobind
          pip install -e ./onnx-light -v

      - name: pip freeze
        run: pip freeze

      - name: Record constant information coverage snapshot
        run: |
          python -u scripts/record_onnx_constant_info_coverage.py

      - name: Commit and push cache data
        run: |
          bash scripts/commit_cache_data.sh cache_data "Update onnx-light constant information coverage cache"
