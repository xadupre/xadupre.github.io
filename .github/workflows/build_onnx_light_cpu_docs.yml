name: DOC onnx-light-cpu

# Manually triggered workflow only. Only the repository owner (xadupre) is
# allowed to actually run the build; any other actor will see the job skipped.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) of xadupre/onnx-light-cpu to build"
        required: false
        default: "main"
      onnx_light_ref:
        description: "Git ref (branch, tag or SHA) of xadupre/onnx-light to build and link against"
        required: false
        default: "main"
  schedule:
    # Rebuild documentation biweekly (1st and 3rd Monday of each month) so it stays in sync with the source repository.
    - cron: "57 7 1-7,15-21 * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    # Only the repository owner is allowed to publish documentation.
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # onnx-light ref to build and link the onnx-light integration against.
      # Uses the workflow_dispatch input when provided (manual runs) and falls
      # back to the same default for scheduled runs, which carry no ``inputs``.
      # Defaults to the ``main`` (default) branch so the docs are built against
      # the latest onnx-light sources from GitHub rather than a pinned release,
      # mirroring onnx-light-cpu's own ``docs.yml`` (recent sources add C++
      # headers the CPU integration relies on that are not yet in a tag). Kept
      # in one place so both code paths stay in sync.
      ONNX_LIGHT_REF: ${{ inputs.onnx_light_ref || 'main' }}
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v6
        with:
          path: site
          # Full history so that we can rebase on top of any concurrent
          # commits to the default branch before pushing the rebuilt docs.
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout onnx-light-cpu
        uses: actions/checkout@v6
        with:
          repository: xadupre/onnx-light-cpu
          ref: ${{ inputs.ref }}
          path: onnx-light-cpu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install system dependencies
        # Doxygen is required to build the C++ API documentation; without it
        # the Sphinx build fails (mirrors build_onnx_light_docs.yml).
        run: sudo apt-get install -y doxygen

      - name: Detect CPU cores
        run: |
          # Expose the number of available CPU cores as
          # ``CMAKE_BUILD_PARALLEL_LEVEL`` for every subsequent step so the
          # onnx-light-cpu C++ build uses all cores rather than a hard-coded
          # value.
          cores="$(nproc)"
          echo "Detected ${cores} CPU cores."
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${cores}" >> "$GITHUB_ENV"

      - name: Build and install onnx-light from source
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # The onnx-light-cpu package and its gallery example depend on the
          # onnx-light Python package (``onnx_light``) *and*, now that the
          # gallery example registers the accelerated kernels through
          # ``onnx_light_cpu.register_kernels()``, on onnx-light's C++
          # development tree: building onnx-light-cpu with
          # ``ONNX_LIGHT_CPU_WITH_ONNX_LIGHT=ON`` compiles the ``_cpuregister``
          # extension, which links onnx-light's ``lib_onnx_core`` located via
          # ``find_package(onnx_light)``. A prebuilt wheel does not ship the
          # CMake package config needed for that, so build onnx-light from
          # source (with sccache to keep repeat runs fast), install its CMake
          # package and expose it on ``CMAKE_PREFIX_PATH``, then ``pip install``
          # it for the Python runtime. This mirrors onnx-light-cpu's own
          # ``docs.yml`` workflow.
          python -m pip install --upgrade pip
          # onnx-light's CMake calls find_package(nanobind) via "python -m
          # nanobind --cmake_dir", so nanobind (and scikit-build-core) must be
          # importable before configuring it. Recent onnx-light sources also
          # query numpy.get_include() at configure time, so numpy is required
          # too (matches onnx-light-cpu's own ``docs.yml``).
          pip install nanobind scikit-build-core numpy
          git clone --depth 1 --branch "${ONNX_LIGHT_REF}" \
            https://github.com/xadupre/onnx-light.git /tmp/onnx-light
          cmake -S /tmp/onnx-light -B /tmp/onnx-light/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/onnx-light/install \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build /tmp/onnx-light/build --config Release --parallel
          cmake --install /tmp/onnx-light/build --config Release
          CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache" \
            pip install /tmp/onnx-light
          echo "CMAKE_PREFIX_PATH=/tmp/onnx-light/install${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          # The onnx-light-cpu ``_cpuregister`` extension links onnx-light's
          # shared libraries and is imported by the gallery example at
          # documentation build time, so the install lib dir must be on
          # LD_LIBRARY_PATH or the import fails with "cannot open shared object
          # file: liblib_onnx_core.so".
          onnx_light_libdir="$(dirname "$(find /tmp/onnx-light/install -name 'liblib_onnx_core.so' | head -1)")"
          echo "LD_LIBRARY_PATH=${onnx_light_libdir}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build and install onnx-light-cpu with doc dependencies
        working-directory: onnx-light-cpu
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # Build the compiled CPU kernel extension: the gallery example
          # imports ``onnx_light_cpu.onnx_py._cpukernels`` (a nanobind
          # extension) and calls ``onnx_light_cpu.register_kernels()`` at
          # documentation build time, so the package itself must be built and
          # installed with the onnx-light integration enabled
          # (``ONNX_LIGHT_CPU_WITH_ONNX_LIGHT=ON``), not just its documentation
          # dependencies. The ``docs`` extra pulls in the Sphinx
          # theme/extensions plus matplotlib needed to render the gallery.
          pip install --upgrade pip
          pip install scikit-build-core nanobind
          pip install \
            -C build-dir=build \
            -C cmake.build-type=Release \
            -C cmake.define.ONNX_LIGHT_CPU_WITH_ONNX_LIGHT=ON \
            -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache \
            -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -e ".[docs]" -v

      - name: pip freeze
        run: pip freeze

      - name: Build documentation
        working-directory: onnx-light-cpu
        # Build serially (no ``-j auto``): the gallery examples import the
        # native ``onnx_light_cpu`` / onnx-light C++ extensions, which crash
        # Sphinx's forked parallel workers ("EOFError" from
        # ``multiprocessing.connection`` while reading sources). Running in a
        # single process keeps the extension in the main interpreter and avoids
        # the worker crash.
        run: sphinx-build -b html docs dist/html

      - name: Copy documentation into site/docs/onnx-light-cpu
        run: |
          rm -rf site/docs/onnx-light-cpu
          mkdir -p site/docs/onnx-light-cpu
          cp -r onnx-light-cpu/dist/html/. site/docs/onnx-light-cpu/
          # Disable Jekyll so that files/folders starting with "_" are served by GitHub Pages.
          touch site/docs/onnx-light-cpu/.nojekyll

      - name: Commit and push updated documentation
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/onnx-light-cpu
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
          else
            built_sha="$(git -C ../onnx-light-cpu rev-parse HEAD)"
            git commit -m "Update onnx-light-cpu documentation (from ${built_sha})"
            # Retry the push a few times, rebasing on top of any new commits
            # that may have landed on the remote in the meantime. This avoids
            # "fetch first" / non-fast-forward push failures when another
            # workflow run pushed to the same branch concurrently.
            branch="${GITHUB_REF_NAME:-main}"
            attempts=5
            for i in $(seq 1 "$attempts"); do
              push_err="$(mktemp)"
              if git push origin "HEAD:${branch}" 2> >(tee "$push_err" >&2); then
                echo "Push succeeded on attempt ${i}."
                rm -f "$push_err"
                exit 0
              fi
              # A permission error (HTTP 403) is not a transient race and will not be
              # fixed by retrying. Fail fast with a pointer to the README section that
              # explains which GitHub setting needs to be changed.
              if grep -qE "error: 403|Permission to .* denied" "$push_err"; then
                rm -f "$push_err"
                echo "" >&2
                echo "Push rejected by GitHub with HTTP 403 (permission denied)." >&2
                echo "Retrying will not help: the authenticated user shown above is" >&2
                echo "not allowed to push to ${branch}." >&2
                echo "" >&2
                echo "See the \"Troubleshooting\" section in README.md for the exact" >&2
                echo "setting to change:" >&2
                echo "  https://github.com/${GITHUB_REPOSITORY}#troubleshooting-none-of-the-actions-can-update-main" >&2
                exit 1
              fi
              rm -f "$push_err"
              echo "Push attempt ${i} failed; rebasing on origin/${branch} and retrying..."
              # Drop any leftover working-tree or untracked changes so that
              # the rebase below does not abort with "cannot rebase: You
              # have unstaged changes." Everything we want to publish has
              # already been committed above, so any remainder is safe to
              # set aside.
              git stash push --include-untracked --quiet -- || true
              git fetch origin "${branch}"
              # Rebase our single doc commit on top of the latest remote state.
              # Prefer our version for the generated docs directory in case of
              # conflicts, since we just rebuilt it.
              if ! git rebase -X ours "origin/${branch}"; then
                echo "Rebase failed; aborting."
                git rebase --abort || true
                exit 1
              fi
              sleep $((i * 5))
            done
            echo "Failed to push after ${attempts} attempts." >&2
            exit 1
          fi
