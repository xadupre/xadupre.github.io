name: DATA onnx stats

# Weekly job that records statistics about the latest ``onnx`` release on
# PyPI (wheel size, opset, number of operators, etc.) and caches the data
# as a CSV file under ``cache_data/onnx/stats.csv``. Only the repository
# owner is allowed to run the job manually; scheduled runs always proceed
# because they are initiated by GitHub itself.

on:
  schedule:
    # Run once a week, Monday at 06:17 UTC. The odd minute avoids the load
    # spikes that happen exactly on the hour, and the hour is offset from
    # the other weekly recording workflows so they do not compete for the
    # same runner slot.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      package:
        description: "PyPI package to inspect."
        required: false
        default: "onnx"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          # Full history so that we can rebase on top of any concurrent
          # commits to the default branch before pushing the new row.
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v6
        with:
          repository: xadupre/cache_data
          path: cache_data
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CACHE_DATA_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install onnx
        run: |
          python -m pip install --upgrade pip
          python -m pip install onnx

      - name: Record onnx stats
        run: |
          python -u scripts/record_onnx_stats.py \
            --package "${{ inputs.package || 'onnx' }}"

      - name: Commit and push cache data
        run: |
          bash scripts/commit_cache_data.sh cache_data "Update onnx stats cache"
