name: DOC devdash-agents

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) of xadupre/devdash-agents to build"
        required: false
        default: "main"
  schedule:
    # Rebuild documentation biweekly (1st and 3rd Monday of each month).
    - cron: "47 9 1-7,15-21 * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v7
        with:
          path: site
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout devdash-agents
        uses: actions/checkout@v7
        with:
          repository: xadupre/devdash-agents
          ref: ${{ inputs.ref || 'main' }}
          path: devdash-agents

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        working-directory: devdash-agents
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        working-directory: devdash-agents
        run: python -m sphinx -b html -W --keep-going docs build/docs

      - name: Copy documentation into site/docs/devdash-agents
        run: |
          rm -rf site/docs/devdash-agents
          mkdir -p site/docs/devdash-agents
          cp -r devdash-agents/build/docs/. site/docs/devdash-agents/
          touch site/docs/devdash-agents/.nojekyll

      - name: Commit and push updated documentation
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/devdash-agents
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          built_sha="$(git -C ../devdash-agents rev-parse HEAD)"
          git commit -m "Update devdash-agents documentation (from ${built_sha})"
          branch="${GITHUB_REF_NAME:-main}"
          attempts=5
          for i in $(seq 1 "$attempts"); do
            push_err="$(mktemp)"
            if git push origin "HEAD:${branch}" 2> >(tee "$push_err" >&2); then
              rm -f "$push_err"
              exit 0
            fi
            if grep -qE "error: 403|Permission to .* denied" "$push_err"; then
              rm -f "$push_err"
              echo "Push rejected (permission denied). See the Troubleshooting section in README.md." >&2
              exit 1
            fi
            rm -f "$push_err"
            echo "Push attempt ${i} failed; rebasing on origin/${branch} and retrying..."
            git stash push --include-untracked --quiet -- || true
            git fetch origin "${branch}"
            if ! git rebase -X ours "origin/${branch}"; then
              git rebase --abort || true
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "Failed to push after ${attempts} attempts." >&2
          exit 1
