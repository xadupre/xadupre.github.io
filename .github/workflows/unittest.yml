name: Unit tests

# Run the Python unit tests under ``scripts/tests`` on Ubuntu for every push
# and pull request targeting the main branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v6

      - name: Checkout yet-another-onnx-builder
        uses: actions/checkout@v6
        with:
          repository: xadupre/yet-another-onnx-builder
          path: yet-another-onnx-builder

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          # ``onnxruntime-genai`` does not publish Linux wheels for Python 3.13
          # yet, and the real ``olive-modelbuilder`` coverage added below needs
          # that package. Keep unittest on 3.12 so the workflow can install the
          # full exporter stack and exercise the real runtime tests.
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install onnx onnxruntime openpyxl sympy
          pip install -e "./yet-another-onnx-builder[torch,transformers,onnxscript]"
          pip install pandas optree sentencepiece tiktoken protobuf
          pip install --upgrade "git+https://github.com/microsoft/Olive.git" onnxruntime-genai

      - name: Run unit tests
        run: |
          python -m unittest discover -s scripts/tests -v
