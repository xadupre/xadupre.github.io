name: DATA onnx-light-cpu build durations

# Periodically records the duration of the GitHub Actions workflow runs of
# ``xadupre/onnx-light-cpu`` and caches the data as CSV files under
# ``cache_data/onnx-light-cpu/build_durations.csv`` (plus per-job rows under
# ``cache_data/onnx-light-cpu/jobs/<job_name>.csv``). These feed the
# ``dashboard/onnx-light-cpu/build-durations.html`` page.
#
# ``record_build_durations.py`` also tracks onnx-light-cpu as part of its
# multi-repository ``DATA build durations`` run, but that shared workflow
# processes the very large ``onnx/onnx`` repository first and can exhaust its
# time budget before reaching onnx-light-cpu. This dedicated workflow scopes
# the fetch to onnx-light-cpu so its data is always gathered, mirroring the
# other dedicated onnx-light-cpu recording workflows.
#
# Only the repository owner is allowed to actually perform the recording so
# that runs triggered by other actors will see the job skipped.

on:
  schedule:
    # Run once a week, Monday at 05:23 UTC. The odd minute avoids the load
    # spikes that happen exactly on the hour, and the hour/minute is offset
    # from the other weekly recording workflows so they do not compete for
    # the same runner slot.
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      months:
        description: "Number of months to look back when the cache is empty."
        required: false
        default: "24"
      since:
        description: "Explicit start date for backfill (ISO 8601, e.g. 2024-01-01). Overrides cache and months when set."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    # Scoped to a single repository, the bootstrap fetch is far smaller than
    # the multi-repository ``DATA build durations`` workflow, but the first
    # run still needs to walk the full history of onnx-light-cpu. Give it a
    # generous budget; subsequent runs only fetch the incremental delta and
    # complete in a few minutes.
    timeout-minutes: 180
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v6
        with:
          repository: xadupre/cache_data
          path: cache_data
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CACHE_DATA_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record onnx-light-cpu build durations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SINCE: ${{ inputs.since }}
        run: |
          echo "=== Gathering onnx-light-cpu CI durations ==="
          echo "Repository : xadupre/onnx-light-cpu"
          echo "Triggered  : ${{ github.event_name }} (actor=${{ github.actor }})"
          echo "Months     : ${{ inputs.months || '24' }}"
          echo "Since      : ${INPUT_SINCE:-(not set, using cache or months)}"
          echo "This step queries the GitHub Actions API for onnx-light-cpu,"
          echo "downloads the workflow runs created since the most recent entry"
          echo "in cache_data/onnx-light-cpu/build_durations.csv, and appends"
          echo "the new rows (plus per-job rows under"
          echo "cache_data/onnx-light-cpu/jobs/<job_name>.csv)."
          echo "============================================="
          SINCE_ARG=()
          if [ -n "${INPUT_SINCE}" ]; then
            SINCE_ARG=(--since "${INPUT_SINCE}")
          fi
          python -u scripts/record_build_durations.py \
            --repo xadupre/onnx-light-cpu \
            --months "${{ inputs.months || '24' }}" \
            "${SINCE_ARG[@]}"

      - name: Commit and push cache data
        if: always()
        run: |
          bash scripts/commit_cache_data.sh cache_data "Update onnx-light-cpu build duration cache"
