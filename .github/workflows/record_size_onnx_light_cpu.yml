name: DATA onnx-light-cpu size and loc

# Runs on a weekly schedule and can also be triggered manually. Only the
# repository owner (xadupre) is allowed to actually run the build when it is
# triggered manually; any other actor will see the job skipped. Scheduled
# runs always proceed because they are initiated by GitHub itself.
on:
  schedule:
    # Run once a week, Monday at 06:47 UTC. The odd minute avoids the load
    # spikes that happen exactly on the hour, and the hour/minute is offset
    # from the other weekly recording workflows so they do not compete for
    # the same runner slot.
    - cron: "47 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) of xadupre/onnx-light-cpu to build"
        required: false
        default: "main"
      onnx_light_ref:
        description: "Git ref (branch, tag or SHA) of xadupre/onnx-light to build and link against"
        required: false
        default: "main"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    # Only the repository owner is allowed to publish data, but scheduled runs
    # (initiated by GitHub itself) are always allowed.
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # onnx-light ref to build and link the onnx-light-cpu integration
      # against. Uses the workflow_dispatch input when provided (manual runs)
      # and falls back to ``main`` for scheduled runs, which carry no
      # ``inputs`` (mirrors build_onnx_light_cpu_docs.yml).
      ONNX_LIGHT_REF: ${{ inputs.onnx_light_ref || 'main' }}
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          path: site
          # Full history so that we can rebase on top of any concurrent
          # commits to the default branch before pushing the recorded data.
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v6
        with:
          repository: xadupre/cache_data
          path: site/cache_data
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CACHE_DATA_SSH_KEY }}

      - name: Checkout onnx-light-cpu
        uses: actions/checkout@v6
        with:
          repository: xadupre/onnx-light-cpu
          ref: ${{ inputs.ref || 'main' }}
          path: onnx-light-cpu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure build parallelism
        run: |
          # Bound both CMake and pip builds to fit the hosted runner's memory.
          echo "CMAKE_BUILD_PARALLEL_LEVEL=2" >> "$GITHUB_ENV"

      - name: Build and install onnx-light from source
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # The onnx-light-cpu package depends on the onnx-light Python package
          # (``onnx_light``) *and* on onnx-light's C++ development tree: building
          # onnx-light-cpu with ``ONNX_LIGHT_CPU_WITH_ONNX_LIGHT=ON`` compiles
          # the ``_cpuregister`` extension, which links onnx-light's
          # ``lib_onnx_core`` located via ``find_package(onnx_light)``. A
          # prebuilt wheel does not ship the CMake package config needed for
          # that, so build onnx-light from source (with sccache to keep repeat
          # runs fast), install its CMake package and expose it on
          # ``CMAKE_PREFIX_PATH``, then ``pip install`` it for the Python
          # runtime. This mirrors build_onnx_light_cpu_docs.yml.
          python -m pip install --upgrade pip
          # onnx-light's CMake calls find_package(nanobind) via "python -m
          # nanobind --cmake_dir", so nanobind (and scikit-build-core) must be
          # importable before configuring it. Recent onnx-light sources also
          # query numpy.get_include() at configure time, so numpy is required
          # too.
          pip install nanobind scikit-build-core numpy
          git clone --depth 1 --branch "${ONNX_LIGHT_REF}" \
            https://github.com/xadupre/onnx-light.git /tmp/onnx-light
          cmake -S /tmp/onnx-light -B /tmp/onnx-light/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/onnx-light/install \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build /tmp/onnx-light/build --config Release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"
          cmake --install /tmp/onnx-light/build --config Release
          pip install /tmp/onnx-light
          echo "CMAKE_PREFIX_PATH=/tmp/onnx-light/install${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          # The onnx-light-cpu ``_cpuregister`` extension links onnx-light's
          # shared libraries, so the install lib dir must be on
          # LD_LIBRARY_PATH.
          onnx_light_libdir="$(dirname "$(find /tmp/onnx-light/install -name 'liblib_onnx_core.so' | head -1)")"
          echo "LD_LIBRARY_PATH=${onnx_light_libdir}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build and install onnx-light-cpu
        working-directory: onnx-light-cpu
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # Build and install the compiled CPU kernel extensions: the package ships
          # ``onnx_light_cpu.onnx_py._cpukernels`` and ``_cpuregister``
          # (nanobind extensions). Build with the onnx-light integration
          # enabled (``ONNX_LIGHT_CPU_WITH_ONNX_LIGHT=ON``) so the released
          # build is measured, matching build_onnx_light_cpu_docs.yml.
          pip install --upgrade pip
          pip install scikit-build-core nanobind
          pip install \
            -C build-dir=build \
            -C cmake.build-type=Release \
            -C cmake.define.ONNX_LIGHT_CPU_WITH_ONNX_LIGHT=ON \
            -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache \
            -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -e "." -v

      - name: pip freeze
        run: pip freeze

      - name: Build and record onnx-light-cpu wheel size
        working-directory: onnx-light-cpu
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # Build a distributable wheel from the onnx-light-cpu checkout and
          # append one CSV row per .whl file produced to
          # cache_data/onnx-light-cpu/wheel_sizes.csv inside the
          # cache-data checkout. The CSV columns
          # (date,commit,run_id,size,name) match the schema produced by
          # scripts/record_wheel_sizes.py so the dashboard can consume rows
          # from either source interchangeably.
          out_dir="${GITHUB_WORKSPACE}/site/cache_data/onnx-light-cpu"
          mkdir -p "$out_dir"
          out="${out_dir}/wheel_sizes.csv"
          if [ ! -f "$out" ]; then
            echo "date,commit,run_id,size,name" > "$out"
          fi
          wheel_dir="${GITHUB_WORKSPACE}/wheel-out"
          rm -rf "$wheel_dir"
          mkdir -p "$wheel_dir"
          # ``pip wheel`` builds the project in an isolated temporary directory
          # (leaving the in-place build artifacts recorded above untouched) and
          # writes one ``.whl`` to ``$wheel_dir``. ``--no-deps`` ensures we only
          # build onnx-light-cpu itself.
          python -m pip wheel . \
            --no-deps \
            --wheel-dir "$wheel_dir" \
            -C build-dir=build-wheel \
            -C cmake.build-type=Release \
            -C cmake.define.ONNX_LIGHT_CPU_WITH_ONNX_LIGHT=ON \
            -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache \
            -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache
          date_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit_sha="$(git rev-parse HEAD)"
          run_id="${GITHUB_RUN_ID:-local}"
          found=0
          for f in "$wheel_dir"/*.whl; do
            [ -f "$f" ] || continue
            size="$(wc -c < "$f")"
            name="$(basename "$f")"
            echo "${date_iso},${commit_sha},${run_id},${size},${name}" >> "$out"
            found=1
            echo "Recorded wheel ${name} (${size} bytes) at ${commit_sha}."
          done
          if [ "$found" -eq 0 ]; then
            echo "No wheel was produced by 'pip wheel .'; nothing to record." >&2
            exit 1
          fi

      - name: Record wheel binary sizes
        working-directory: onnx-light-cpu
        run: |
          # Record the uncompressed size of every shared library shipped in the
          # wheel. Editable installs keep these files outside the source tree,
          # so inspect the distributable wheel built above.
          out_dir="${GITHUB_WORKSPACE}/site/cache_data/onnx-light-cpu"
          mkdir -p "$out_dir"
          out="${out_dir}/so_sizes.csv"
          date_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit_sha="$(git rev-parse HEAD)"
          python - "$out" "$date_iso" "$commit_sha" "${GITHUB_WORKSPACE}/wheel-out"/*.whl <<'PY'
          import csv
          import os
          import sys
          import zipfile

          out, date_iso, commit_sha, *wheels = sys.argv[1:]
          rows = []
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  for info in archive.infolist():
                      name = os.path.basename(info.filename)
                      if name.endswith((".so", ".dylib", ".pyd")):
                          rows.append((date_iso, commit_sha, info.file_size, name))
          if not rows:
              raise RuntimeError("No shared library found in the onnx-light-cpu wheel.")
          exists = os.path.exists(out)
          with open(out, "a", newline="", encoding="utf-8") as stream:
              writer = csv.writer(stream)
              if not exists:
                  writer.writerow(("date", "commit", "size", "name"))
              writer.writerows(rows)
          for _, _, size, name in rows:
              print(f"Recorded {name} ({size} bytes) at {commit_sha}.")
          PY

      - name: Record Python and C++ lines of code
        run: |
          # Count the lines of Python and C++ source code in the
          # onnx-light-cpu checkout and append one row per language to
          # cache_data/onnx-light-cpu/loc.csv inside the cache-data checkout.
          # The "Commit and push cache data" step below publishes the new rows
          # alongside the shared-library and wheel sizes.
          python "${GITHUB_WORKSPACE}/site/scripts/record_loc.py" \
            --source-dir "${GITHUB_WORKSPACE}/onnx-light-cpu" \
            --output "${GITHUB_WORKSPACE}/site/cache_data/onnx-light-cpu/loc.csv"

      - name: Commit and push cache data
        run: |
          built_sha="$(git -C onnx-light-cpu rev-parse HEAD)"
          bash site/scripts/commit_cache_data.sh site/cache_data \
            "Update onnx-light-cpu size/loc data (from ${built_sha})"
