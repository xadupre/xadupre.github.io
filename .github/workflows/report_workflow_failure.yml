name: Report workflow failure

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  issues: write

concurrency:
  group: report-workflow-failure-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.name, 'DATA ') ||
       startsWith(github.event.workflow_run.name, 'DOC '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Do not check out or execute code from the triggering run: workflow_run
      # has a write token even when the original workflow was unprivileged.
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail

          title="Workflow failed: ${WORKFLOW_NAME}"
          body="$(printf 'The **%s** workflow failed.\n\n- Run: %s\n- Branch: `%s`\n- Commit: `%s`\n- Attempt: %s\n\nSee the workflow run for failed jobs and logs.' \
            "$WORKFLOW_NAME" "$RUN_URL" "$RUN_BRANCH" "$RUN_SHA" "$RUN_ATTEMPT")"

          issues="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | [.number, .title] | @tsv')"
          while IFS=$'\t' read -r number existing_title; do
            if [[ "$existing_title" == "$title" ]]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
              exit 0
            fi
          done <<< "$issues"

          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
