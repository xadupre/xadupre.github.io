name: DATA onnx-light backend test coverage

# Weekly job that runs every backend node test collected by
# ``onnx-light`` (``onnx_light.onnx_lib.backend.test.case.collect_test_case``)
# against ``onnxruntime``, the Python reference implementation shipped
# with ``onnx`` and the ``onnx-light`` C++ reference evaluator
# (``onnx_light.onnx.reference``), both before and after registering
# ``onnx-light-cpu`` kernels, and caches the pass/fail status as JSON
# under ``cache_data/onnx-light/backend_test_coverage.json``. The
# dashboards at ``dashboard/onnx-light/backend-test-coverage.html`` and
# ``dashboard/onnx-light-cpu/backend-end-coverage.html`` consume that file.

on:
  schedule:
    # Run once a week, Monday at 07:29 UTC. The odd minute avoids the load
    # spikes that happen exactly on the hour, and the time is offset from
    # the other weekly recording workflows so they do not compete for the
    # same runner slot.
    - cron: "29 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v7
        with:
          # Full history so that we can rebase on top of any concurrent
          # commits to the default branch before pushing the new snapshot.
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v7
        with:
          repository: xadupre/cache_data
          path: cache_data
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CACHE_DATA_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Checkout onnx-light
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light
          path: onnx-light

      - name: Checkout onnx-light-cpu
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light-cpu
          path: onnx-light-cpu

      - name: Configure build parallelism
        run: |
          # Bound both CMake and pip builds to fit the hosted runner's memory.
          echo "CMAKE_BUILD_PARALLEL_LEVEL=2" >> "$GITHUB_ENV"

      - name: Build and install onnx-light from source
        run: |
          python -m pip install --upgrade pip
          pip install onnx onnxruntime numpy scikit-build-core nanobind
          # Both extensions must use the same Python ABI to share nanobind types.
          pip install ./onnx-light \
            -C cmake.define.ONNX_LIGHT_INSTALL=ON \
            -C cmake.define.ONNX_LIGHT_PYTHON_STABLE_ABI=OFF
          onnx_light_prefix="$(python -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
          test -f "${onnx_light_prefix}/lib/cmake/onnx_light/onnx_lightConfig.cmake"
          echo "CMAKE_PREFIX_PATH=${onnx_light_prefix}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${onnx_light_prefix}/onnx_light/onnx_py:${onnx_light_prefix}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build and install onnx-light-cpu
        working-directory: onnx-light-cpu
        run: |
          pip install \
            --no-deps \
            -C build-dir=build \
            -C cmake.build-type=Release \
            -C cmake.define.ONNX_LIGHT_CPU_WITH_ONNX_LIGHT=ON \
            -C cmake.define.ONNX_LIGHT_CPU_PYTHON_STABLE_ABI=OFF \
            -e . -v

      - name: pip freeze
        run: pip freeze

      - name: Verify onnx-light-cpu backend
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import numpy as np
          from onnx import TensorProto, helper
          from record_onnx_backend_test_coverage import _run_with_onnx_light_cpu

          x = helper.make_tensor_value_info("X", TensorProto.FLOAT, [2])
          y = helper.make_tensor_value_info("Y", TensorProto.FLOAT, [2])
          model = helper.make_model(
              helper.make_graph([helper.make_node("Abs", ["X"], ["Y"])], "abs", [x], [y]),
              opset_imports=[helper.make_opsetid("", 18)],
          )
          (result,) = _run_with_onnx_light_cpu(model)(
              [np.array([-1.0, 2.0], dtype=np.float32)]
          )
          np.testing.assert_array_equal(result, [1.0, 2.0])
          PY

      - name: Record backend test coverage snapshot
        run: |
          python -u scripts/record_onnx_backend_test_coverage.py

      - name: Commit and push cache data
        run: |
          bash scripts/commit_cache_data.sh cache_data "Update onnx-light backend test coverage cache"
