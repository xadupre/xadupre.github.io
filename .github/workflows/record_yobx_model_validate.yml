name: DATA export model-ids to ONNX

# Runs on a weekly schedule and can also be triggered manually. Only the
# repository owner (xadupre) is allowed to run the workflow manually; any
# other actor will see the job skipped. Scheduled runs always proceed
# because they are initiated by GitHub itself.
on:
  schedule:
    # Run once a week, Monday at 09:23 UTC. The odd minute avoids the load
    # spikes that happen exactly on the hour, and the hour is offset from
    # the other weekly recording workflows so they do not compete for the
    # same runner slot.
    - cron: "23 9 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) of xadupre/yet-another-onnx-builder to use"
        required: false
        default: "main"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          path: site
          # Full history so that we can rebase on top of any concurrent
          # commits to the default branch before pushing the new snapshot.
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v6
        with:
          repository: xadupre/cache_data
          path: site/cache_data
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Checkout yet-another-onnx-builder
        uses: actions/checkout@v6
        with:
          repository: xadupre/yet-another-onnx-builder
          ref: ${{ inputs.ref || 'main' }}
          path: yet-another-onnx-builder

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install yet-another-onnx-builder with torch+transformers extras
        working-directory: yet-another-onnx-builder
        run: |
          python -m pip install --upgrade pip
          # ``torch`` and ``transformers`` are required by the validate
          # command which loads a HuggingFace model and exports it to ONNX.
          # ``pandas`` is used by ``validate_model`` when comparing the
          # exported ONNX model outputs against the torch reference (the
          # discrepancy table is built with a ``pandas.DataFrame``); without
          # it the export succeeds but the discrepancies step raises
          # ``No module named 'pandas'`` and the dashboard ends up
          # reporting the cell as a failed export.
          # ``openpyxl`` is required by ``validate_model`` when writing
          # discrepancy reports to Excel, and ``optree`` is required by
          # recent versions of ``torch`` to traverse pytree structures
          # during export.
          # ``onnxruntime`` is required by the discrepancy checks used by
          # the ``yobx`` / ``dynamo`` exporter cells.
          # ``sentencepiece`` and ``tiktoken`` are tokenizer backends
          # required by some HuggingFace models loaded during validation.
          # ``protobuf`` is also required alongside ``sentencepiece`` so that
          # ``transformers`` can convert a slow SentencePiece tokenizer (for
          # example the one shipped with ``mistralai/Mistral-7B-v0.3``) into
          # the fast ``tokenizers`` backend; without it the conversion fails
          # with a misleading ``Couldn't instantiate the backend tokenizer
          # ... You need to have sentencepiece or tiktoken installed`` error
          # even when ``sentencepiece`` itself is present. Note the conversion
          # additionally needs ``PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python``
          # (set by the recorder script) because the ``protobuf`` version
          # pulled in by ``onnx`` is incompatible with the C++ descriptor code
          # in ``sentencepiece_model_pb2``.
          pip install -e ".[torch,transformers,onnxscript]" pandas openpyxl optree onnxruntime sentencepiece tiktoken protobuf
          # Install the development version of Olive from main so the
          # ``olive-modelbuilder`` column in the dashboard exercises the
          # latest ``ModelBuilder`` pass. ``onnxruntime-genai`` is the
          # runtime dependency that pass uses to build the ONNX graph.
          pip install --upgrade "git+https://github.com/microsoft/Olive.git" onnxruntime-genai

      - name: pip freeze
        run: pip freeze

      - name: Record model validate snapshot
        working-directory: site
        env:
          # Some HuggingFace models exported by ``validate_model`` are gated
          # and require an authenticated download. The token is provided as
          # a repository secret; when it is not configured the step still
          # runs but the gated models will fail to load.
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          # Resolve the actual commit SHA of yet-another-onnx-builder so that
          # the dashboard can link the snapshot to a specific source revision.
          commit_sha="$(git -C ../yet-another-onnx-builder rev-parse HEAD)"
          YOBX_COMMIT="$commit_sha" python -u scripts/record_yobx_model_validate.py

      - name: Commit and push cache data
        run: |
          built_sha="$(git -C yet-another-onnx-builder rev-parse HEAD)"
          bash site/scripts/commit_cache_data.sh site/cache_data \
            "Update yet-another-onnx-builder model validate (from ${built_sha})"
