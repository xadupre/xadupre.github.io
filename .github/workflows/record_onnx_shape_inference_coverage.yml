name: DATA onnx-light shape inference coverage

# Weekly job that runs every backend test tagged ``inference`` collected
# by ``onnx-light`` (``onnx_light.onnx_lib.backend.test.case.collect_test_case``)
# through several shape-inference implementations:
#   * ``onnx_light.onnx.shape_inference`` (``onnx-light``)
#   * ``onnx.shape_inference`` (``onnx``)
#   * ``onnx_shape_inference.infer_symbolic_shapes`` (``onnx-shape-inference``)
#   * ``onnxruntime.transformers.shape_infer_helper`` (symbolic shape
#     inference shipped with ``onnxruntime``)
#   * ``yobx.xshape.BasicShapeBuilder`` (shape inference shipped with
#     ``yet-another-onnx-builder``)
# and caches the per-intermediate correctness as JSON under
# ``cache_data/onnx-light/shape_inference_coverage.json``. The dashboard
# at ``dashboard/onnx-light/shape-inference-coverage.html`` consumes
# that file.

on:
  schedule:
    # Run once a week, Monday at 07:41 UTC. The odd minute avoids the load
    # spikes that happen exactly on the hour, and the time is offset from
    # the other weekly recording workflows so they do not compete for the
    # same runner slot.
    - cron: "41 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          # Full history so that we can rebase on top of any concurrent
          # commits to the default branch before pushing the new snapshot.
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v6
        with:
          repository: xadupre/cache_data
          path: cache_data
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CACHE_DATA_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Checkout onnx-light
        uses: actions/checkout@v6
        with:
          repository: xadupre/onnx-light
          path: onnx-light

      - name: Checkout yet-another-onnx-builder
        uses: actions/checkout@v6
        with:
          repository: xadupre/yet-another-onnx-builder
          path: yet-another-onnx-builder

      - name: Detect CPU cores
        run: |
          # Expose the number of available CPU cores as
          # ``CMAKE_BUILD_PARALLEL_LEVEL`` for every subsequent step so the
          # onnx-light C++ build uses all cores rather than a hard-coded value.
          cores="$(nproc)"
          echo "Detected ${cores} CPU cores."
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${cores}" >> "$GITHUB_ENV"

      - name: Install onnx, onnx-shape-inference, onnxruntime, onnx-light and yobx
        run: |
          python -m pip install --upgrade pip
          pip install onnx numpy scikit-build-core nanobind onnx_ir "git+https://github.com/justinchuby/onnx-shape-inference.git" onnxruntime sympy
          pip install -e ./onnx-light -v
          pip install -e ./yet-another-onnx-builder

      - name: pip freeze
        run: pip freeze

      - name: Record shape inference coverage snapshot
        run: |
          python -u scripts/record_onnx_shape_inference_coverage.py

      - name: Commit and push cache data
        run: |
          bash scripts/commit_cache_data.sh cache_data "Update onnx-light shape inference coverage cache"
