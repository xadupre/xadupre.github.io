name: DATA onnx-light size and ops

# Runs on a weekly schedule and can also be triggered manually. Only the
# repository owner (xadupre) is allowed to actually run the build when it is
# triggered manually; any other actor will see the job skipped. Scheduled
# runs always proceed because they are initiated by GitHub itself.
on:
  schedule:
    # Run once a week, Monday at 05:17 UTC. The odd minute avoids the load
    # spikes that happen exactly on the hour, and the hour is offset from the
    # other weekly recording workflow (record_build_durations) so they do not
    # compete for the same runner slot.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) of xadupre/onnx-light to build"
        required: false
        default: "main"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build-and-publish:
    # Only the repository owner is allowed to publish documentation, but
    # scheduled runs (initiated by GitHub itself) are always allowed.
    if: github.event_name == 'schedule' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v6
        with:
          path: site
          # Full history so that we can rebase on top of any concurrent
          # commits to the default branch before pushing the rebuilt docs.
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout onnx-light
        uses: actions/checkout@v6
        with:
          repository: xadupre/onnx-light
          ref: ${{ inputs.ref || 'main' }}
          path: onnx-light

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: pip freeze
        run: pip freeze

      - name: Detect CPU cores
        run: |
          # Expose the number of available CPU cores as
          # ``CMAKE_BUILD_PARALLEL_LEVEL`` for every subsequent step so the
          # onnx-light C++ build uses all cores rather than a hard-coded value.
          cores="$(nproc)"
          echo "Detected ${cores} CPU cores."
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${cores}" >> "$GITHUB_ENV"

      - name: Install onnx-light with doc dependencies
        working-directory: onnx-light
        run: |
          # ``onnx`` is required so that
          # ``onnx_light.tools.schema_comparison.compute_schema_comparison()`` can
          # populate the ``onnx``-side columns of the per-operator comparison
          # table consumed by the dashboard (otherwise it would silently
          # report empty columns for the reference package). We install the
          # ``onnx-weekly`` build (nightly snapshot of upstream ``onnx``'s
          # ``main`` branch) rather than the latest stable ``onnx`` release
          # so that newly-added operators and their backend test scenarios
          # (e.g. ``ai.onnx.preview.FlexAttention`` and its 11 ``export_*``
          # snippets) are picked up by ``collect_snippets()`` below and
          # reported in the per-operator comparison table — otherwise the
          # dashboard would show ``0`` ``onnx`` backend tests for any
          # operator that has not yet shipped in a stable ``onnx`` release.
          # ``scikit-build-core`` is the PEP-517 build backend declared in
          # onnx-light's ``pyproject.toml``. It must be installed alongside
          # the rest of the toolchain so that the later
          # ``pip wheel . --no-build-isolation`` step (used by the
          # ``Build and record onnx-light wheel size`` step below) can find
          # the backend — otherwise pip aborts with
          # ``BackendUnavailable: Cannot import 'scikit_build_core.build'``
          # and no wheel-size row is appended, leaving the chart empty.
          python -m pip install scikit-build-core setuptools nanobind numpy ml-dtypes onnx-weekly
          python setup.py build_ext --inplace

      - name: ls
        working-directory: onnx-light
        run: ls onnx_light/onnx_py

      - name: Record onnx_py shared library sizes
        working-directory: onnx-light
        run: |
          # Record the size of every shared library produced in onnx_py/ so
          # that the evolution of the compiled extension size can be tracked
          # over time. The data is appended (one CSV row per .so file) to
          # cache_data/onnx-light/so_sizes.csv inside the xadupre.github.io
          # checkout so that the existing "Commit and push updated
          # documentation" step below picks it up and pushes it back to this
          # repository.
          out_dir="${GITHUB_WORKSPACE}/site/cache_data/onnx-light"
          mkdir -p "$out_dir"
          out="${out_dir}/so_sizes.csv"
          if [ ! -f "$out" ]; then
            echo "date,commit,size,name" > "$out"
          fi
          date_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit_sha="$(git rev-parse HEAD)"
          found=0
          # Track every shared library shipped in the onnx_py package (.so on
          # Linux/macOS, .dylib on macOS, .pyd on Windows just in case).
          while IFS= read -r -d '' f; do
            size="$(wc -c < "$f")"
            name="$(basename "$f")"
            echo "${date_iso},${commit_sha},${size},${name}" >> "$out"
            found=1
            echo "Recorded ${name} (${size} bytes) at ${commit_sha}."
          done < <(find onnx_light/onnx_py -maxdepth 2 -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.dylib' -o -name '*.pyd' \) -print0)
          if [ "$found" -eq 0 ]; then
            echo "No shared library found under onnx_light/onnx_py/; nothing to record."
          fi

      - name: Build and record onnx-light wheel size
        working-directory: onnx-light
        run: |
          # Build a distributable wheel from the onnx-light checkout and
          # append one CSV row per .whl file produced to
          # cache_data/onnx-light/wheel_sizes.csv inside the
          # xadupre.github.io checkout. This is the primary source of data
          # for the wheel-size series on
          # dashboard/onnx-light/package-size.html: it does not depend on
          # the upstream ``build_release.yml`` workflow (which has had no
          # successful artifact-producing run, leaving the chart empty
          # before this step was added). The CSV columns
          # (date,commit,run_id,size,name) match the schema produced by
          # scripts/record_wheel_sizes.py so the dashboard can consume rows
          # from either source interchangeably.
          out_dir="${GITHUB_WORKSPACE}/site/cache_data/onnx-light"
          mkdir -p "$out_dir"
          out="${out_dir}/wheel_sizes.csv"
          if [ ! -f "$out" ]; then
            echo "date,commit,run_id,size,name" > "$out"
          fi
          wheel_dir="${GITHUB_WORKSPACE}/wheel-out"
          rm -rf "$wheel_dir"
          mkdir -p "$wheel_dir"
          # ``pip wheel`` reuses the build artifacts already produced by the
          # earlier ``setup.py build_ext --inplace`` step and writes one
          # ``.whl`` per project to ``$wheel_dir``. ``--no-deps`` ensures we
          # only build onnx-light itself; ``--no-build-isolation`` reuses
          # the already-installed setuptools/nanobind/numpy/ml-dtypes
          # toolchain rather than re-resolving them in a fresh env.
          python -m pip wheel . \
            --no-deps \
            --no-build-isolation \
            --wheel-dir "$wheel_dir"
          date_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit_sha="$(git rev-parse HEAD)"
          run_id="${GITHUB_RUN_ID:-local}"
          found=0
          for f in "$wheel_dir"/*.whl; do
            [ -f "$f" ] || continue
            size="$(wc -c < "$f")"
            name="$(basename "$f")"
            echo "${date_iso},${commit_sha},${run_id},${size},${name}" >> "$out"
            found=1
            echo "Recorded wheel ${name} (${size} bytes) at ${commit_sha}."
          done
          if [ "$found" -eq 0 ]; then
            echo "No wheel was produced by 'pip wheel .'; nothing to record." >&2
            exit 1
          fi

      - name: Record wheel sizes from build_release.yml artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Complement the locally-built wheel size recorded above with the
          # per-platform/per-Python wheel sizes published by successful runs
          # of the upstream ``build_release.yml`` workflow in
          # xadupre/onnx-light, when any are available. Both sources append
          # to cache_data/onnx-light/wheel_sizes.csv using the same schema;
          # the script deduplicates by ``run_id`` so re-running is safe.
          python -u "${GITHUB_WORKSPACE}/site/scripts/record_wheel_sizes.py" \
            --cache-dir "${GITHUB_WORKSPACE}/site/cache_data" \
            --repo xadupre/onnx-light \
            --workflow build_release.yml

      - name: Backfill shared library sizes from build_release.yml artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The inline "Record onnx_py shared library sizes" step above only
          # records a single snapshot of the current build, so on its own the
          # "Binary size over time" chart can never show more than the history
          # accumulated since that step first ran. Backfill it the same way the
          # wheel-size series is backfilled: download the artifacts published by
          # the upstream ``build_release.yml`` workflow over the last 6 months
          # and record one row per shared library found inside them. Rows are
          # appended to cache_data/onnx-light/so_sizes.csv using the same schema
          # as the inline step and deduplicated by ``commit`` so re-running is
          # safe and already-recorded commits are not double counted.
          python -u "${GITHUB_WORKSPACE}/site/scripts/record_so_sizes.py" \
            --cache-dir "${GITHUB_WORKSPACE}/site/cache_data" \
            --repo xadupre/onnx-light \
            --workflow build_release.yml \
            --months 6

      - name: Record Python and C++ lines of code
        run: |
          # Count the lines of Python and C++ source code in the onnx-light
          # checkout and append one row per language to
          # cache_data/onnx-light/loc.csv inside the xadupre.github.io
          # checkout. The "Commit and push cache data" step below will then
          # publish the new rows alongside the shared-library sizes.
          python "${GITHUB_WORKSPACE}/site/scripts/record_loc.py" \
            --source-dir "${GITHUB_WORKSPACE}/onnx-light" \
            --output "${GITHUB_WORKSPACE}/site/cache_data/onnx-light/loc.csv"

      - name: Record schema comparison snapshot
        working-directory: onnx-light
        env:
          OUT: ${{ github.workspace }}/site/cache_data/onnx-light/schema_comparison.json
        run: |
          # Dump the latest per-operator comparison between ``onnx`` and
          # ``onnx_light`` schemas (one row per (domain, operator)) as JSON
          # so that the interactive dashboard at
          # dashboard/onnx-light/schema-comparison.html can render one
          # searchable / sortable table per domain without needing Sphinx.
          mkdir -p "$(dirname "$OUT")"
          export DATE_ISO="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export COMMIT_SHA="$(git rev-parse HEAD)"
          python - <<'PY'
          import json
          import os
          from dataclasses import asdict

          from onnx_light.tools.schema_comparison import compute_schema_comparison

          comparison = compute_schema_comparison()

          # Override the ``onnx``-side backend-test counts so that they
          # reflect the number of *logical* test scenarios declared in the
          # upstream ``onnx`` test sources (one count per ``export_*()``
          # method, equivalent to one entry per
          # :func:`onnx.backend.test.case.collect_snippets` snippet), rather
          # than the number of generated test-data sub-directories under
          # ``onnx/backend/test/data/node``. The directory-based count
          # double-counts test scenarios that ``expect()`` materialises
          # twice (typically a paired ``..._example`` / ``..._random`` or
          # ``..._select_last_index`` variant), which inflates the figure
          # the dashboard reports — for example ``ArgMax`` would show 16
          # instead of the 8 logical scenarios declared in
          # ``onnx/backend/test/case/node/argmax.py``.
          try:
              from onnx.backend.test.case import collect_snippets as _collect_snippets

              _snippets = _collect_snippets()
              for _row in comparison.rows:
                  if _row.name in _snippets:
                      _row.onnx_backend_tests = len(_snippets[_row.name])
          except ImportError:
              pass

          # Collect the IR_VERSION and the latest ai.onnx opset version from
          # both packages so that the dashboard can show, as its first table,
          # the ONNX specification version each side targets. ``onnx_light``
          # exposes its IR_VERSION and ``OpSchema`` registry via the
          # ``onnx_light.onnx.defs`` submodule, which forwards the
          # ``onnx_ir_version()`` / ``onnx_opset_version()`` / ``get_all_schemas()``
          # symbols from its C++ ``onnx_lib`` extension (the ``onnx_light.onnx``
          # package itself does not re-export ``IR_VERSION`` or ``defs`` at
          # the top level, unlike upstream ``onnx``).
          def _max_ai_onnx_opset(defs_mod):
              versions = [
                  s.since_version
                  for s in defs_mod.get_all_schemas()
                  if (s.domain or "ai.onnx") == "ai.onnx"
              ]
              return max(versions) if versions else None

          versions = {
              "onnx_ir_version": None,
              "onnx_opset_ai_onnx": None,
              "onnx_light_ir_version": None,
              "onnx_light_opset_ai_onnx": None,
          }
          try:
              import onnx
              from onnx import defs as _onnx_defs

              versions["onnx_ir_version"] = int(onnx.IR_VERSION)
              try:
                  versions["onnx_opset_ai_onnx"] = int(_onnx_defs.onnx_opset_version())
              except Exception:
                  versions["onnx_opset_ai_onnx"] = _max_ai_onnx_opset(_onnx_defs)
          except ImportError:
              pass
          try:
              from onnx_light.onnx import defs as _light_defs

              versions["onnx_light_ir_version"] = int(_light_defs.IR_VERSION)
              try:
                  versions["onnx_light_opset_ai_onnx"] = int(
                      _light_defs.onnx_opset_version()
                  )
              except Exception:
                  versions["onnx_light_opset_ai_onnx"] = _max_ai_onnx_opset(_light_defs)
          except ImportError:
              pass

          payload = {
              "date": os.environ["DATE_ISO"],
              "commit": os.environ["COMMIT_SHA"],
              "onnx_available": comparison.onnx_available,
              "versions": versions,
              "totals": {
                  "onnx": comparison.total_onnx,
                  "onnx_light": comparison.total_onnx_light,
                  "onnx_shape_inference": comparison.total_onnx_shape_inference,
                  "onnx_light_shape_inference": comparison.total_onnx_light_shape_inference,
                  "onnx_backend_tests": comparison.total_onnx_backend_tests,
                  "onnx_light_backend_tests": comparison.total_onnx_light_backend_tests,
              },
              "rows": [asdict(r) for r in comparison.rows],
          }
          out = os.environ["OUT"]
          with open(out, "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, sort_keys=True)
          print(
              "Wrote {} rows ({} domains) to {}".format(
                  len(payload["rows"]),
                  len({r["domain"] for r in payload["rows"]}),
                  out,
              )
          )
          PY

      - name: Commit and push cache data
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/onnx-light cache_data/onnx-light
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            built_sha="$(git -C ../onnx-light rev-parse HEAD)"
            git commit -m "Update onnx-light documentation (from ${built_sha})"
            # Retry the push a few times, rebasing on top of any new commits
            # that may have landed on the remote in the meantime. This avoids
            # "fetch first" / non-fast-forward push failures when another
            # workflow run pushed to the same branch concurrently.
            branch="${GITHUB_REF_NAME:-main}"
            attempts=5
            for i in $(seq 1 "$attempts"); do
              push_err="$(mktemp)"
              if git push origin "HEAD:${branch}" 2> >(tee "$push_err" >&2); then
                echo "Push succeeded on attempt ${i}."
                rm -f "$push_err"
                exit 0
              fi
              # A permission error (HTTP 403) is not a transient race and will not be
              # fixed by retrying. Fail fast with a pointer to the README section that
              # explains which GitHub setting needs to be changed.
              if grep -qE "error: 403|Permission to .* denied" "$push_err"; then
                rm -f "$push_err"
                echo "" >&2
                echo "Push rejected by GitHub with HTTP 403 (permission denied)." >&2
                echo "Retrying will not help: the authenticated user shown above is" >&2
                echo "not allowed to push to ${branch}." >&2
                echo "" >&2
                echo "See the \"Troubleshooting\" section in README.md for the exact" >&2
                echo "setting to change:" >&2
                echo "  https://github.com/${GITHUB_REPOSITORY}#troubleshooting-none-of-the-actions-can-update-main" >&2
                exit 1
              fi
              rm -f "$push_err"
              echo "Push attempt ${i} failed; rebasing on origin/${branch} and retrying..."
              # Drop any leftover working-tree or untracked changes so that
              # the rebase below does not abort with "cannot rebase: You
              # have unstaged changes." Everything we want to publish has
              # already been committed above, so any remainder is safe to
              # set aside.
              git stash push --include-untracked --quiet -- || true
              git fetch origin "${branch}"
              # Rebase our single doc commit on top of the latest remote state.
              # Prefer our version for the generated docs directory in case of
              # conflicts, since we just rebuilt it.
              if ! git rebase -X ours "origin/${branch}"; then
                echo "Rebase failed; aborting."
                git rebase --abort || true
                exit 1
              fi
              sleep $((i * 5))
            done
            echo "Failed to push after ${attempts} attempts." >&2
            exit 1
          fi
