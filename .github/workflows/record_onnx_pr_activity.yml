name: DATA onnx PR activity

# Records a daily snapshot of open and recently merged pull requests in
# onnx/onnx for dashboard/onnx/pr-activity.html.

on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v6
        with:
          repository: xadupre/cache_data
          path: cache_data
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CACHE_DATA_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record ONNX PR activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u scripts/record_pr_activity.py --repo onnx/onnx

      - name: Commit and push cache data
        run: |
          bash scripts/commit_cache_data.sh cache_data "Update onnx PR activity cache"
