name: DATA onnx-light-cpu benchmark

# Weekly job that runs the benchmark-tagged C++ backend tests registered by
# onnx-light-cpu and measures them with onnxruntime and onnx-light-cpu, then
# caches the results as JSON
# under ``cache_data/onnx-light-cpu/examples_benchmark.json``. The dashboard at
# ``dashboard/onnx-light-cpu/cpu-benchmark.html`` consumes that file.

on:
  schedule:
    # Run once a week, Monday at 08:41 UTC. The odd minute avoids the load
    # spikes that happen exactly on the hour, and the offset from the
    # onnx-light benchmark workflow (08:13) avoids competing for the same
    # runner slot.
    - cron: "41 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Checkout onnx-light
        uses: actions/checkout@v6
        with:
          repository: xadupre/onnx-light
          path: onnx-light

      - name: Checkout onnx-light-cpu
        uses: actions/checkout@v6
        with:
          repository: xadupre/onnx-light-cpu
          path: onnx-light-cpu

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Detect CPU cores
        run: |
          cores="$(nproc)"
          echo "Detected ${cores} CPU cores."
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${cores}" >> "$GITHUB_ENV"

      - name: Install onnx, onnxruntime and build onnx-light from source
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # The onnx-light-cpu ``register_kernels()`` call used by the benchmark
          # lives in the compiled ``_cpuregister`` extension, which is only built
          # when onnx-light-cpu is compiled with
          # ``ONNX_LIGHT_CPU_WITH_ONNX_LIGHT=ON``. That build links onnx-light's
          # ``lib_onnx_core`` located via ``find_package(onnx_light)``, so
          # onnx-light must be built from source (its CMake package config is not
          # shipped in a plain wheel) and exposed on ``CMAKE_PREFIX_PATH``. This
          # mirrors ``record_onnx_light_benchmark.yml``.
          python -m pip install --upgrade pip
          pip install onnx onnxruntime numpy scikit-build-core nanobind
          cmake -S ./onnx-light -B ./onnx-light/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=./onnx-light/install \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build ./onnx-light/build --config Release --parallel
          cmake --install ./onnx-light/build --config Release
          pip install ./onnx-light
          onnx_light_install="$(cd ./onnx-light/install && pwd)"
          echo "CMAKE_PREFIX_PATH=${onnx_light_install}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          # The onnx-light-cpu ``_cpuregister`` extension links onnx-light's
          # shared libraries, so the install lib dir must be on
          # ``LD_LIBRARY_PATH`` or the import fails with "cannot open shared
          # object file: liblib_onnx_core.so".
          onnx_light_lib="$(find "${onnx_light_install}" -name 'liblib_onnx_core.so' | head -1)"
          if [ -z "${onnx_light_lib}" ]; then
            echo "liblib_onnx_core.so not found under ${onnx_light_install};" >&2
            echo "the onnx-light C++ install is incomplete, so onnx-light-cpu's" >&2
            echo "_cpuregister extension cannot link against it." >&2
            exit 1
          fi
          onnx_light_libdir="$(dirname "${onnx_light_lib}")"
          echo "LD_LIBRARY_PATH=${onnx_light_libdir}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build and install onnx-light-cpu with the onnx-light integration
        working-directory: onnx-light-cpu
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # Enable the onnx-light integration so the ``_cpuregister`` extension —
          # and therefore ``onnx_light_cpu.register_kernels()`` used by the
          # benchmark — is compiled and links the same shared ``lib_onnx_core``
          # that the running ``onnx_light`` uses.
          pip install \
            --no-deps \
            -C build-dir=build \
            -C cmake.build-type=Release \
            -C cmake.define.ONNX_LIGHT_CPU_WITH_ONNX_LIGHT=ON \
            -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache \
            -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -e . -v

      - name: pip freeze
        run: pip freeze

      - name: Record benchmark snapshot
        run: |
          python -u scripts/record_onnx_light_cpu_benchmark.py

      - name: Commit and push cache data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache_data/onnx-light-cpu/examples_benchmark.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update onnx-light-cpu benchmark cache"
          branch="${GITHUB_REF_NAME:-main}"
          attempts=5
          for i in $(seq 1 "$attempts"); do
            push_err="$(mktemp)"
            if git push origin "HEAD:${branch}" 2> >(tee "$push_err" >&2); then
              echo "Push succeeded on attempt ${i}."
              rm -f "$push_err"
              exit 0
            fi
            if grep -qE "error: 403|Permission to .* denied" "$push_err"; then
              rm -f "$push_err"
              echo "" >&2
              echo "Push rejected by GitHub with HTTP 403 (permission denied)." >&2
              echo "Retrying will not help: the authenticated user shown above is" >&2
              echo "not allowed to push to ${branch}." >&2
              echo "" >&2
              echo "See the \"Troubleshooting\" section in README.md for the exact" >&2
              echo "setting to change:" >&2
              echo "  https://github.com/${GITHUB_REPOSITORY}#troubleshooting-none-of-the-actions-can-update-main" >&2
              exit 1
            fi
            rm -f "$push_err"
            echo "Push attempt ${i} failed; rebasing on origin/${branch} and retrying..."
            git stash push --include-untracked --quiet -- || true
            git fetch origin "${branch}"
            if ! git rebase -X ours "origin/${branch}"; then
              echo "Rebase failed; aborting."
              git rebase --abort || true
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "Failed to push after ${attempts} attempts." >&2
          exit 1
