name: DATA onnx-light-cpu benchmark

# Jobs spread across the week run the benchmark-tagged C++ backend tests
# registered by onnx-light-cpu, one data type at a time, and measure them with
# onnxruntime and onnx-light-cpu, then cache the merged results as JSON
# under ``cache_data/onnx-light-cpu/examples_benchmark.json``. The dashboard at
# ``dashboard/onnx-light-cpu/cpu-benchmark.html`` consumes that file.

on:
  schedule:
    # Two types per weekday and one per weekend day, all at odd minutes to
    # avoid load spikes exactly on the hour.
    - cron: "41 8 * * 1"
    - cron: "41 20 * * 1"
    - cron: "41 8 * * 2"
    - cron: "41 20 * * 2"
    - cron: "41 8 * * 3"
    - cron: "41 20 * * 3"
    - cron: "41 8 * * 4"
    - cron: "41 20 * * 4"
    - cron: "41 8 * * 5"
    - cron: "41 20 * * 5"
    - cron: "41 8 * * 6"
    - cron: "41 8 * * 0"
  workflow_dispatch:
    inputs:
      type:
        description: Data type to benchmark
        required: true
        type: choice
        options:
          - float32
          - float64
          - float16
          - bfloat16
          - int4
          - int8
          - int16
          - int32
          - int64
          - uint8
          - uint16
          - uint32

permissions:
  contents: write

jobs:
  select-type:
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.select.outputs.type }}
    steps:
      - name: Select benchmark type
        id: select
        env:
          REQUESTED_TYPE: ${{ inputs.type }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "${REQUESTED_TYPE}" ]; then
            type="${REQUESTED_TYPE}"
          else
            case "${SCHEDULE}" in
              "41 8 * * 1") type=float32 ;;
              "41 20 * * 1") type=float64 ;;
              "41 8 * * 2") type=float16 ;;
              "41 20 * * 2") type=bfloat16 ;;
              "41 8 * * 3") type=int4 ;;
              "41 20 * * 3") type=int8 ;;
              "41 8 * * 4") type=int16 ;;
              "41 20 * * 4") type=int32 ;;
              "41 8 * * 5") type=int64 ;;
              "41 20 * * 5") type=uint8 ;;
              "41 8 * * 6") type=uint16 ;;
              "41 8 * * 0") type=uint32 ;;
              *)
                echo "Unsupported schedule: ${SCHEDULE}" >&2
                exit 1
                ;;
            esac
          fi
          echo "Selected benchmark type: ${type}"
          echo "type=${type}" >> "$GITHUB_OUTPUT"

  record:
    needs: select-type
    name: record (${{ needs.select-type.outputs.type }})
    if: >-
      github.event_name == 'schedule' || github.actor == github.repository_owner ||
      github.actor == 'github-actions[bot]'
    concurrency:
      group: ${{ github.workflow }}-${{ needs.select-type.outputs.type }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v7
        with:
          repository: xadupre/cache_data
          path: cache_data
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CACHE_DATA_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Checkout onnx-light
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light
          path: onnx-light

      - name: Checkout onnx-light-cpu
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light-cpu
          path: onnx-light-cpu

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure build parallelism
        run: |
          # Bound both CMake and pip builds to fit the hosted runner's memory.
          echo "CMAKE_BUILD_PARALLEL_LEVEL=2" >> "$GITHUB_ENV"

      - name: Install onnx, onnxruntime and build onnx-light from source
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # The onnx-light-cpu ``register_kernels()`` call used by the benchmark
          # lives in the compiled ``_cpuregister`` extension, which is only built
          # when onnx-light-cpu is compiled with
          # ``ONNX_LIGHT_CPU_WITH_ONNX_LIGHT=ON``. That build links onnx-light's
          # ``lib_onnx_core`` located via ``find_package(onnx_light)``. Build
          # the Python runtime and the C++ package in the same wheel so their
          # nanobind RuntimeContext types match.
          python -m pip install --upgrade pip
          pip install onnx onnxruntime numpy scikit-build-core nanobind
          pip install ./onnx-light \
            -C cmake.define.ONNX_LIGHT_INSTALL=ON \
            -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache \
            -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache
          onnx_light_prefix="$(python -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
          test -f "${onnx_light_prefix}/lib/cmake/onnx_light/onnx_lightConfig.cmake"
          echo "CMAKE_PREFIX_PATH=${onnx_light_prefix}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          # Load the runtime's copy first; the C++ install has the same libraries
          # but lives under lib/ for find_package(onnx_light).
          echo "LD_LIBRARY_PATH=${onnx_light_prefix}/onnx_light/onnx_py:${onnx_light_prefix}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build and install onnx-light-cpu with the onnx-light integration
        working-directory: onnx-light-cpu
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # Enable the onnx-light integration so the ``_cpuregister`` extension —
          # and therefore ``onnx_light_cpu.register_kernels()`` used by the
          # benchmark — is compiled and links the same shared ``lib_onnx_core``
          # that the running ``onnx_light`` uses.
          pip install \
            --no-deps \
            -C build-dir=build \
            -C cmake.build-type=Release \
            -C cmake.define.ONNX_LIGHT_CPU_WITH_ONNX_LIGHT=ON \
            -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache \
            -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -e . -v

      - name: pip freeze
        run: pip freeze

      - name: Verify onnx-light runtime compatibility
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from onnx_light.onnx.reference import ReferenceEvaluator
          from onnx_light_cpu import set_kernel_usage_recording
          from record_onnx_light_cpu_benchmark import (
              _load_benchmark_test,
              discover_benchmark_tests,
          )

          name = discover_benchmark_tests(benchmark_type="float32")[0]["name"]
          model = _load_benchmark_test(name)["model"]
          session = ReferenceEvaluator(model.SerializeToString())
          set_kernel_usage_recording(session, True)
          set_kernel_usage_recording(session, False)
          PY

      - name: Record benchmark snapshot
        run: |
          python -u scripts/record_onnx_light_cpu_benchmark.py \
            --type "${{ needs.select-type.outputs.type }}"

      - name: Commit and push cache data
        run: |
          bash scripts/commit_cache_data.sh cache_data "Update onnx-light-cpu benchmark cache"
