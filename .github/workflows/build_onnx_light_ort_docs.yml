name: DOC onnx-light-ort

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) of xadupre/onnx-light-ort to build"
        required: false
        default: "main"
  schedule:
    # Rebuild documentation biweekly (1st and 3rd Monday of each month).
    - cron: "27 9 1-7,15-21 * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v7
        with:
          path: site
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout onnx-light-ort
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light-ort
          ref: ${{ inputs.ref || 'main' }}
          path: onnx-light-ort

      - name: Checkout onnx-light
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light
          ref: main
          path: onnx-light
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        working-directory: onnx-light-ort
        run: python -m pip install -r docs/requirements.txt

      - name: Build native libraries for the gallery
        working-directory: onnx-light-ort
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_ONNX_LIGHT="$GITHUB_WORKSPACE/onnx-light" \
            -DONNX_LIGHT_ORT_BUILD_TESTS=OFF \
            -DONNX_LIGHT_ORT_BUILD_PYTHON=ON
          cmake --build build --parallel "$(nproc)"

      - name: Build documentation
        working-directory: onnx-light-ort
        env:
          PYTHONPATH: ${{ github.workspace }}/onnx-light-ort/build/python
          ONNX_LIGHT_ORT_PLUGIN_LIBRARY: ${{ github.workspace }}/onnx-light-ort/build/onnx_light_ort/custom_ops/libonnx_light_ort_custom_ops.so
          ONNX_LIGHT_ORT_HOST_LIBRARY: ${{ github.workspace }}/onnx-light-ort/build/onnx_light_ort/bridge_ops_ort_called_by_light/libonnx_light_ort_bridge_ops_ort_called_by_light.so
          ONNX_LIGHT_ORT_INCOMING_CUSTOM_OP_LIBRARY: ${{ github.workspace }}/onnx-light-ort/build/onnx_light_ort/bridge_ops_ort_called_by_light/libonnx_light_ort_ort_custom_ops.so
        run: python -m sphinx -b html -W --keep-going docs build/docs

      - name: Copy documentation into site/docs/onnx-light-ort
        run: |
          rm -rf site/docs/onnx-light-ort
          mkdir -p site/docs/onnx-light-ort
          cp -r onnx-light-ort/build/docs/. site/docs/onnx-light-ort/
          touch site/docs/onnx-light-ort/.nojekyll

      - name: Commit and push updated documentation
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/onnx-light-ort
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          built_sha="$(git -C ../onnx-light-ort rev-parse HEAD)"
          git commit -m "Update onnx-light-ort documentation (from ${built_sha})"
          branch="${GITHUB_REF_NAME:-main}"
          attempts=5
          for i in $(seq 1 "$attempts"); do
            push_err="$(mktemp)"
            if git push origin "HEAD:${branch}" 2> >(tee "$push_err" >&2); then
              rm -f "$push_err"
              exit 0
            fi
            if grep -qE "error: 403|Permission to .* denied" "$push_err"; then
              rm -f "$push_err"
              echo "Push rejected (permission denied). See the Troubleshooting section in README.md." >&2
              exit 1
            fi
            rm -f "$push_err"
            echo "Push attempt ${i} failed; rebasing on origin/${branch} and retrying..."
            git stash push --include-untracked --quiet -- || true
            git fetch origin "${branch}"
            if ! git rebase -X ours "origin/${branch}"; then
              git rebase --abort || true
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "Failed to push after ${attempts} attempts." >&2
          exit 1
