name: DOC onnx-light-kernel-images

# Manually triggered workflow only. Only the repository owner (xadupre) is
# allowed to actually run the build; any other actor will see the job skipped.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) of xadupre/onnx-light-kernel-images to build"
        required: false
        default: "main"
  schedule:
    # Rebuild documentation biweekly (1st and 3rd Monday of each month) so it stays in sync with the source repository.
    - cron: "51 7 1-7,15-21 * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  # ``actions: read`` is required so that the wheel-install step below can
  # list and download artifacts of the onnx-light ``build_release.yml``
  # workflow.
  actions: read

jobs:
  build-and-publish:
    # Only the repository owner is allowed to publish documentation.
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v6
        with:
          path: site
          # Full history so that we can rebase on top of any concurrent
          # commits to the default branch before pushing the rebuilt docs.
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout onnx-light-kernel-images
        uses: actions/checkout@v6
        with:
          repository: xadupre/onnx-light-kernel-images
          ref: ${{ inputs.ref }}
          path: onnx-light-kernel-images

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install onnx-light from the latest full release wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The gallery example ``examples/plot_image_formats.py`` imports the
          # onnx-light Python package (``onnx_light``). Building onnx-light from
          # source is expensive, so install a prebuilt CPython 3.12 manylinux
          # wheel instead. The onnx-light GitHub *releases* page only publishes
          # the size-reduced wheels (built with ``ONNX_LIGHT_BUILD_KERNELS=OFF``):
          # their file names carry a ``0reduced`` build tag and they omit the
          # operator kernels the gallery relies on. The full, kernels-enabled
          # wheels are published as artifacts of the ``build_release.yml``
          # workflow, so download the wheel from the most recent successful run
          # of that workflow rather than from the releases page.
          python -m pip install --upgrade pip
          run_id="$(gh run list \
            --repo xadupre/onnx-light \
            --workflow build_release.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [ -z "${run_id}" ]; then
            echo "No successful build_release.yml run found for xadupre/onnx-light." >&2
            exit 1
          fi
          echo "Using build_release.yml run ${run_id}"
          wheel_dir="$(mktemp -d)"
          # The ``wheels-linux-x86_64`` artifact bundles the full manylinux
          # wheels for every packaged CPython version.
          gh run download "${run_id}" \
            --repo xadupre/onnx-light \
            --name wheels-linux-x86_64 \
            --dir "${wheel_dir}"
          # Keep the glibc (manylinux) CPython 3.12 wheel and, defensively,
          # skip any size-reduced wheel that carries the ``0reduced`` build tag.
          wheel="$(find "${wheel_dir}" -name 'onnx_light-*cp312-cp312*manylinux*x86_64*.whl' \
            ! -name '*reduced*' | sort -V | tail -n1)"
          if [ -z "${wheel}" ]; then
            echo "No full onnx_light cp312 manylinux wheel found in the latest build_release.yml artifacts." >&2
            exit 1
          fi
          echo "Installing ${wheel}"
          pip install "${wheel}"

      - name: Build and install onnx-light-kernel-images with doc dependencies
        working-directory: onnx-light-kernel-images
        run: |
          # Build the compiled ImageDecoder kernels: the gallery example imports
          # ``onnx_light_kernel_images.onnx_py._imgpykernels`` (a nanobind
          # extension), so the package itself must be built and installed, not
          # just its documentation dependencies. The prebuilt onnx-light C++ SDK
          # archive required to compile the extension is fetched automatically by
          # CMake (see the repository's CMakeLists.txt). The ``docs`` extra pulls
          # in the Sphinx theme/extensions plus Pillow and matplotlib needed to
          # render the gallery.
          pip install scikit-build-core nanobind
          pip install ".[docs]" -v

      - name: pip freeze
        run: pip freeze

      - name: Build documentation
        working-directory: onnx-light-kernel-images
        run: |
          sphinx-build -b html docs docs/_build/html -j auto

      - name: Copy documentation into site/docs/onnx-light-kernel-images
        run: |
          rm -rf site/docs/onnx-light-kernel-images
          mkdir -p site/docs/onnx-light-kernel-images
          cp -r onnx-light-kernel-images/docs/_build/html/. site/docs/onnx-light-kernel-images/
          # Disable Jekyll so that files/folders starting with "_" are served by GitHub Pages.
          touch site/docs/onnx-light-kernel-images/.nojekyll

      - name: Commit and push updated documentation
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/onnx-light-kernel-images
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
          else
            built_sha="$(git -C ../onnx-light-kernel-images rev-parse HEAD)"
            git commit -m "Update onnx-light-kernel-images documentation (from ${built_sha})"
            # Retry the push a few times, rebasing on top of any new commits
            # that may have landed on the remote in the meantime. This avoids
            # "fetch first" / non-fast-forward push failures when another
            # workflow run pushed to the same branch concurrently.
            branch="${GITHUB_REF_NAME:-main}"
            attempts=5
            for i in $(seq 1 "$attempts"); do
              push_err="$(mktemp)"
              if git push origin "HEAD:${branch}" 2> >(tee "$push_err" >&2); then
                echo "Push succeeded on attempt ${i}."
                rm -f "$push_err"
                exit 0
              fi
              # A permission error (HTTP 403) is not a transient race and will not be
              # fixed by retrying. Fail fast with a pointer to the README section that
              # explains which GitHub setting needs to be changed.
              if grep -qE "error: 403|Permission to .* denied" "$push_err"; then
                rm -f "$push_err"
                echo "" >&2
                echo "Push rejected by GitHub with HTTP 403 (permission denied)." >&2
                echo "Retrying will not help: the authenticated user shown above is" >&2
                echo "not allowed to push to ${branch}." >&2
                echo "" >&2
                echo "See the \"Troubleshooting\" section in README.md for the exact" >&2
                echo "setting to change:" >&2
                echo "  https://github.com/${GITHUB_REPOSITORY}#troubleshooting-none-of-the-actions-can-update-main" >&2
                exit 1
              fi
              rm -f "$push_err"
              echo "Push attempt ${i} failed; rebasing on origin/${branch} and retrying..."
              # Drop any leftover working-tree or untracked changes so that
              # the rebase below does not abort with "cannot rebase: You
              # have unstaged changes." Everything we want to publish has
              # already been committed above, so any remainder is safe to
              # set aside.
              git stash push --include-untracked --quiet -- || true
              git fetch origin "${branch}"
              # Rebase our single doc commit on top of the latest remote state.
              # Prefer our version for the generated docs directory in case of
              # conflicts, since we just rebuilt it.
              if ! git rebase -X ours "origin/${branch}"; then
                echo "Rebase failed; aborting."
                git rebase --abort || true
                exit 1
              fi
              sleep $((i * 5))
            done
            echo "Failed to push after ${attempts} attempts." >&2
            exit 1
          fi
