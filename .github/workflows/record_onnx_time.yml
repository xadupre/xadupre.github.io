name: DATA onnx-light load/save timings

# Weekly job that runs the plot_onnx_time benchmark and appends its results to
# the history consumed by dashboard/onnx-light/onnx-time.html.

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) of xadupre/onnx-light to benchmark"
        required: false
        default: "main"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v6
        with:
          repository: xadupre/cache_data
          path: cache_data
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Checkout onnx-light
        uses: actions/checkout@v6
        with:
          repository: xadupre/onnx-light
          ref: ${{ inputs.ref || 'main' }}
          path: onnx-light

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect CPU cores
        run: |
          cores="$(nproc)"
          echo "Detected ${cores} CPU cores."
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${cores}" >> "$GITHUB_ENV"

      - name: Install onnx-light with documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./onnx-light[docs]" -v

      - name: Build C++ load benchmark for onnx-light
        working-directory: onnx-light
        run: |
          bash examples/load_onnx_light_time/build.sh \
            "${PWD}/build/install-examples" \
            "${PWD}/build/examples-lib" \
            "${PWD}/build/examples/load_onnx_light_time"

      - name: Build C++ save benchmark for onnx-light
        working-directory: onnx-light
        run: |
          bash examples/save_onnx_light_time/build.sh \
            "${PWD}/build/install-examples" \
            "${PWD}/build/examples-lib" \
            "${PWD}/build/examples/save_onnx_light_time"

      - name: Build C++ load benchmark for ONNX
        working-directory: onnx-light
        run: |
          bash examples/load_onnx_time/build.sh \
            "${PWD}/build/install-examples" \
            "${PWD}/build/examples-lib" \
            "${PWD}/build/examples/load_onnx_time"

      - name: pip freeze
        run: pip freeze

      - name: Run plot_onnx_time benchmark
        env:
          CICPP: "1"
          MPLBACKEND: Agg
        run: |
          python -u onnx-light/docs/examples/proto/plot_onnx_time.py \
            > "${RUNNER_TEMP}/plot_onnx_time.txt"
          cat "${RUNNER_TEMP}/plot_onnx_time.txt"

      - name: Record timing snapshot
        run: |
          machine="${{ runner.os }} ${{ runner.arch }} / $(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          python scripts/record_onnx_time.py \
            "${RUNNER_TEMP}/plot_onnx_time.txt" \
            --output cache_data/onnx-light/onnx_time.csv \
            --commit "$(git -C onnx-light rev-parse HEAD)" \
            --run-id "${{ github.run_id }}" \
            --machine "${machine}"

      - name: Commit and push cache data
        run: |
          bash scripts/commit_cache_data.sh cache_data "Update onnx-light timing cache"
