name: DATA PR statistics

# Periodically records statistics about merged pull requests for the
# tracked repositories and caches the data as CSV files under
# ``cache_data/<repo>/pr_stats.csv``. Only the repository owner is
# allowed to actually perform the recording so that runs triggered by
# other actors will see the job skipped.

on:
  schedule:
    # Run once a week, Monday at 04:42 UTC. The odd minute avoids the
    # load spikes that happen exactly on the hour.
    - cron: "42 4 * * 1"
  workflow_dispatch:
    inputs:
      months:
        description: "Number of months to look back when the cache is empty."
        required: false
        default: "24"
      since:
        description: "Explicit start date for backfill (ISO 8601, e.g. 2024-01-01). Overrides cache and months when set."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record PR statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SINCE: ${{ inputs.since }}
        run: |
          echo "=== Gathering PR statistics ==="
          echo "Repository : ${{ github.repository }}"
          echo "Triggered  : ${{ github.event_name }} (actor=${{ github.actor }})"
          echo "Months     : ${{ inputs.months || '24' }}"
          echo "Since      : ${INPUT_SINCE:-(not set, using cache or months)}"
          echo "This step queries the GitHub PR API for each tracked"
          echo "repository, downloads the merged PRs updated since the most"
          echo "recent entry in cache_data/<repo>/pr_stats.csv, and appends"
          echo "the new rows (one per merged PR, with commits, comments and"
          echo "Copilot-authored counts)."
          echo "=============================="
          SINCE_ARG=()
          if [ -n "${INPUT_SINCE}" ]; then
            SINCE_ARG=(--since "${INPUT_SINCE}")
          fi
          python -u scripts/record_pr_stats.py \
            --months "${{ inputs.months || '24' }}" \
            "${SINCE_ARG[@]}"

      - name: Commit and push cache data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache_data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update PR statistics cache"
          branch="${GITHUB_REF_NAME:-main}"
          attempts=5
          for i in $(seq 1 "$attempts"); do
            push_err="$(mktemp)"
            if git push origin "HEAD:${branch}" 2> >(tee "$push_err" >&2); then
              echo "Push succeeded on attempt ${i}."
              rm -f "$push_err"
              exit 0
            fi
            # A permission error (HTTP 403) is not a transient race and will not be
            # fixed by retrying. Fail fast with a pointer to the README section that
            # explains which GitHub setting needs to be changed.
            if grep -qE "error: 403|Permission to .* denied" "$push_err"; then
              rm -f "$push_err"
              echo "" >&2
              echo "Push rejected by GitHub with HTTP 403 (permission denied)." >&2
              echo "Retrying will not help: the authenticated user shown above is" >&2
              echo "not allowed to push to ${branch}." >&2
              echo "" >&2
              echo "See the \"Troubleshooting\" section in README.md for the exact" >&2
              echo "setting to change:" >&2
              echo "  https://github.com/${GITHUB_REPOSITORY}#troubleshooting-none-of-the-actions-can-update-main" >&2
              exit 1
            fi
            rm -f "$push_err"
            echo "Push attempt ${i} failed; rebasing on origin/${branch} and retrying..."
            # Drop any leftover working-tree or untracked changes so that the
            # rebase below does not abort with "cannot rebase: You have
            # unstaged changes." Everything we want to publish has already
            # been committed above, so any remainder is safe to set aside.
            git stash push --include-untracked --quiet -- || true
            git fetch origin "${branch}"
            if ! git rebase -X ours "origin/${branch}"; then
              echo "Rebase failed; aborting."
              git rebase --abort || true
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "Failed to push after ${attempts} attempts." >&2
          exit 1
