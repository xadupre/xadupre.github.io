name: DATA PR statistics

# Periodically records statistics about merged pull requests for the
# tracked repositories and caches the data as CSV files under
# ``cache_data/<repo>/pr_stats.csv``. Only the repository owner is
# allowed to actually perform the recording so that runs triggered by
# other actors will see the job skipped.

on:
  schedule:
    # Run once a week, Monday at 04:42 UTC. The odd minute avoids the
    # load spikes that happen exactly on the hour.
    - cron: "42 4 * * 1"
  workflow_dispatch:
    inputs:
      months:
        description: "Number of months to look back when the cache is empty."
        required: false
        default: "24"
      since:
        description: "Explicit start date for backfill (ISO 8601, e.g. 2024-01-01). Overrides cache and months when set."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v6
        with:
          repository: xadupre/cache_data
          path: cache_data
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CACHE_DATA_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record PR statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SINCE: ${{ inputs.since }}
        run: |
          echo "=== Gathering PR statistics ==="
          echo "Repository : ${{ github.repository }}"
          echo "Triggered  : ${{ github.event_name }} (actor=${{ github.actor }})"
          echo "Months     : ${{ inputs.months || '24' }}"
          echo "Since      : ${INPUT_SINCE:-(not set, using cache or months)}"
          echo "This step queries the GitHub PR API for each tracked"
          echo "repository, downloads the merged PRs updated since the most"
          echo "recent entry in cache_data/<repo>/pr_stats.csv, and appends"
          echo "the new rows (one per merged PR, with commits, comments and"
          echo "Copilot-authored counts)."
          echo "=============================="
          SINCE_ARG=()
          if [ -n "${INPUT_SINCE}" ]; then
            SINCE_ARG=(--since "${INPUT_SINCE}")
          fi
          python -u scripts/record_pr_stats.py \
            --months "${{ inputs.months || '24' }}" \
            "${SINCE_ARG[@]}"

      - name: Commit and push cache data
        if: always()
        run: |
          bash scripts/commit_cache_data.sh cache_data "Update PR statistics cache"
