name: DATA PyPI downloads

# Weekly job that records the number of PyPI downloads (last day / week /
# month) for the ONNX-related packages tracked by this repository. The
# data is fetched from pypistats.org and cached as CSV files under
# ``cache_data/<package>/downloads.csv``. Only the repository owner is
# allowed to run the job manually; scheduled runs always proceed because
# they are initiated by GitHub itself.

on:
  schedule:
    # Run once a week, Monday at 06:43 UTC. The odd minute avoids the load
    # spikes that happen exactly on the hour, and the time is offset from
    # the other weekly recording workflows so they do not compete for the
    # same runner slot.
    - cron: "43 6 * * 1"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated list of PyPI packages to inspect (default: all tracked packages)."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          # Full history so that we can rebase on top of any concurrent
          # commits to the default branch before pushing the new rows.
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v6
        with:
          repository: xadupre/cache_data
          path: cache_data
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record PyPI downloads
        # Do not abort the job when the script exits non-zero (which happens
        # as soon as *any* package fails to fetch from pypistats.org). We
        # still want the subsequent steps to commit and push whatever rows
        # were successfully recorded for the other packages.
        continue-on-error: true
        run: |
          set -e
          args=()
          if [ -n "${{ inputs.packages }}" ]; then
            for pkg in ${{ inputs.packages }}; do
              args+=("--package" "$pkg")
            done
          fi
          python -u scripts/record_pypi_downloads.py "${args[@]}"

      - name: Commit and push cache data
        run: |
          bash scripts/commit_cache_data.sh cache_data "Update PyPI downloads cache"
