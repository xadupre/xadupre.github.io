name: DATA PyPI downloads

# Weekly job that records the number of PyPI downloads (last day / week /
# month) for the ONNX-related packages tracked by this repository. The
# data is fetched from pypistats.org and cached as CSV files under
# ``cache_data/<package>/downloads.csv``. Only the repository owner is
# allowed to run the job manually; scheduled runs always proceed because
# they are initiated by GitHub itself.

on:
  schedule:
    # Run once a week, Monday at 06:43 UTC. The odd minute avoids the load
    # spikes that happen exactly on the hour, and the time is offset from
    # the other weekly recording workflows so they do not compete for the
    # same runner slot.
    - cron: "43 6 * * 1"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated list of PyPI packages to inspect (default: all tracked packages)."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          # Full history so that we can rebase on top of any concurrent
          # commits to the default branch before pushing the new rows.
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record PyPI downloads
        # Do not abort the job when the script exits non-zero (which happens
        # as soon as *any* package fails to fetch from pypistats.org). We
        # still want the subsequent steps to commit and push whatever rows
        # were successfully recorded for the other packages.
        continue-on-error: true
        run: |
          set -e
          args=()
          if [ -n "${{ inputs.packages }}" ]; then
            for pkg in ${{ inputs.packages }}; do
              args+=("--package" "$pkg")
            done
          fi
          python -u scripts/record_pypi_downloads.py "${args[@]}"

      - name: Commit and push cache data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache_data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update PyPI downloads cache"
          branch="${GITHUB_REF_NAME:-main}"
          attempts=5
          for i in $(seq 1 "$attempts"); do
            push_err="$(mktemp)"
            if git push origin "HEAD:${branch}" 2> >(tee "$push_err" >&2); then
              echo "Push succeeded on attempt ${i}."
              rm -f "$push_err"
              exit 0
            fi
            # A permission error (HTTP 403) is not a transient race and will not be
            # fixed by retrying. Fail fast with a pointer to the README section that
            # explains which GitHub setting needs to be changed.
            if grep -qE "error: 403|Permission to .* denied" "$push_err"; then
              rm -f "$push_err"
              echo "" >&2
              echo "Push rejected by GitHub with HTTP 403 (permission denied)." >&2
              echo "Retrying will not help: the authenticated user shown above is" >&2
              echo "not allowed to push to ${branch}." >&2
              echo "" >&2
              echo "See the \"Troubleshooting\" section in README.md for the exact" >&2
              echo "setting to change:" >&2
              echo "  https://github.com/${GITHUB_REPOSITORY}#troubleshooting-none-of-the-actions-can-update-main" >&2
              exit 1
            fi
            rm -f "$push_err"
            echo "Push attempt ${i} failed; rebasing on origin/${branch} and retrying..."
            # Drop any leftover working-tree or untracked changes so that the
            # rebase below does not abort with "cannot rebase: You have
            # unstaged changes." Everything we want to publish has already
            # been committed above, so any remainder is safe to set aside.
            git stash push --include-untracked --quiet -- || true
            git fetch origin "${branch}"
            if ! git rebase -X ours "origin/${branch}"; then
              echo "Rebase failed; aborting."
              git rebase --abort || true
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "Failed to push after ${attempts} attempts." >&2
          exit 1
