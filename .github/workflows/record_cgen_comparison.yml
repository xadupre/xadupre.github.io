name: DATA onnx-light vs emx-onnx-cgen comparison

# Weekly job that fetches the operator support table from the
# ``emmtrix/emx-onnx-cgen`` repository, cross-references it with the
# onnx-light schema snapshot, and writes the merged result to
# ``cache_data/onnx-light/cgen_comparison.json``.
# The dashboard at ``dashboard/onnx-light/cgen-comparison.html`` renders
# this file.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v6
        with:
          repository: xadupre/cache_data
          path: cache_data
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CACHE_DATA_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install emx-onnx-cgen onnx

      - name: Record cgen comparison snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python -u scripts/record_cgen_comparison.py

      - name: Commit and push cache data
        run: |
          bash scripts/commit_cache_data.sh cache_data "Update onnx-light vs emx-onnx-cgen comparison cache"
