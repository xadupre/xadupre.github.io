name: DOC onnx-light

# Manually triggered workflow only. Only the repository owner (xadupre) is
# allowed to actually run the build; any other actor will see the job skipped.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) of xadupre/onnx-light to build"
        required: false
        default: "main"
  schedule:
    # Rebuild documentation biweekly (1st and 3rd Monday of each month) so it stays in sync with the source repository.
    - cron: "42 7 1-7,15-21 * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    # Only the repository owner is allowed to publish documentation.
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v6
        with:
          path: site
          # Full history so that we can rebase on top of any concurrent
          # commits to the default branch before pushing the rebuilt docs.
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout onnx-light
        uses: actions/checkout@v6
        with:
          repository: xadupre/onnx-light
          ref: ${{ inputs.ref }}
          path: onnx-light

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install graphviz
        # ``ts-graphviz/setup-graphviz@v2`` runs ``apt-get update`` with no
        # timeout: when one of the Ubuntu mirrors is unreachable the step hangs
        # for hours until the whole job is cancelled. Installing the package
        # directly (and bounding the step in time) keeps the build responsive.
        timeout-minutes: 10
        run: sudo apt-get install -y graphviz

      - name: Install system dependencies
        run: sudo apt-get install -y doxygen

      - name: Detect CPU cores
        run: |
          # Expose the number of available CPU cores as
          # ``CMAKE_BUILD_PARALLEL_LEVEL`` for every subsequent step so the
          # onnx-light C++ build (and the parallel Sphinx build below) use
          # all cores rather than a hard-coded value.
          cores="$(nproc)"
          echo "Detected ${cores} CPU cores."
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${cores}" >> "$GITHUB_ENV"

      - name: Install onnx-light with doc dependencies
        working-directory: onnx-light
        run: |
          pip install scikit-build-core nanobind
          pip install -e ".[docs]" -v

      - name: pip freeze
        run: pip freeze

      # The C++ examples are built one by one so that each example shows up as
      # its own step in the workflow logs. The per-example build scripts are
      # invoked with a shared install prefix and lib build directory (matching
      # the defaults used by examples/build.sh), so onnx_light is only
      # compiled once by the first example and then reused by every
      # subsequent example.
      - name: Build C++ example - load_onnx_light_time
        working-directory: onnx-light
        run: |
          bash examples/load_onnx_light_time/build.sh \
            "${PWD}/build/install-examples" \
            "${PWD}/build/examples-lib" \
            "${PWD}/build/examples/load_onnx_light_time"

      - name: Build C++ example - run_add_node_test
        working-directory: onnx-light
        run: |
          bash examples/run_add_node_test/build.sh \
            "${PWD}/build/install-examples" \
            "${PWD}/build/examples-lib" \
            "${PWD}/build/examples/run_add_node_test"

      - name: Build C++ example - run_backend_test_ort
        working-directory: onnx-light
        run: |
          bash examples/run_backend_test_ort/build.sh \
            "${PWD}/build/install-examples" \
            "${PWD}/build/examples-lib" \
            "${PWD}/build/examples/run_backend_test_ort"

      - name: Build C++ example - save_onnx_light_time
        working-directory: onnx-light
        run: |
          bash examples/save_onnx_light_time/build.sh \
            "${PWD}/build/install-examples" \
            "${PWD}/build/examples-lib" \
            "${PWD}/build/examples/save_onnx_light_time"

      - name: Build onnx-light
        working-directory: onnx-light
        run: pip install -e .[dev]

      - name: Build C++ example - load_onnx_time
        working-directory: onnx-light
        run: |
          bash examples/load_onnx_time/build.sh \
            "${PWD}/build/install-examples" \
            "${PWD}/build/examples-lib" \
            "${PWD}/build/examples/load_onnx_time"

      - name: Build documentation
        working-directory: onnx-light
        # Build serially because the gallery imports native C++ extensions,
        # which can stall Sphinx's forked workers while reading sources.
        env:
          # Signal to the documentation build that the C++ examples have
          # been compiled in CI so their artefacts/logs can be included.
          CICPP: "1"
          # Persist the ci_durations REST API cache inside the onnx-light
          # checkout (see ``docs/ci_durations.rst``) so it can be committed
          # and reused across documentation builds.
          ONNX_LIGHT_DOCS_CACHE_IN_REPO: "1"
          # ``ci_durations.rst`` resolves the in-repo cache root via
          # ``GITHUB_WORKSPACE`` (falling back to ``os.getcwd()``). On this
          # workflow ``GITHUB_WORKSPACE`` points at the xadupre.github.io
          # checkout, not at the onnx-light one, so override it here.
          GITHUB_WORKSPACE: ${{ github.workspace }}/onnx-light
        run: python -m sphinx docs dist/html

      - name: Copy documentation into site/docs/onnx-light
        run: |
          rm -rf site/docs/onnx-light
          mkdir -p site/docs/onnx-light
          cp -r onnx-light/dist/html/. site/docs/onnx-light/
          # Disable Jekyll so that files/folders starting with "_" are served by GitHub Pages.
          touch site/docs/onnx-light/.nojekyll

      - name: Record plot_onnx_time history
        run: |
          machine="${{ runner.os }} ${{ runner.arch }} / $(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          python site/scripts/record_onnx_time.py \
            site/docs/onnx-light/auto_examples_proto/plot_onnx_time.html \
            --output site/cache_data/onnx-light/onnx_time.csv \
            --commit "$(git -C onnx-light rev-parse HEAD)" \
            --run-id "${{ github.run_id }}" \
            --machine "${machine}"

      - name: Commit and push updated documentation
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/onnx-light cache_data/onnx-light
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
          else
            built_sha="$(git -C ../onnx-light rev-parse HEAD)"
            git commit -m "Update onnx-light documentation (from ${built_sha})"
            # Retry the push a few times, rebasing on top of any new commits
            # that may have landed on the remote in the meantime. This avoids
            # "fetch first" / non-fast-forward push failures when another
            # workflow run pushed to the same branch concurrently.
            branch="${GITHUB_REF_NAME:-main}"
            attempts=5
            for i in $(seq 1 "$attempts"); do
              push_err="$(mktemp)"
              if git push origin "HEAD:${branch}" 2> >(tee "$push_err" >&2); then
                echo "Push succeeded on attempt ${i}."
                rm -f "$push_err"
                exit 0
              fi
              # A permission error (HTTP 403) is not a transient race and will not be
              # fixed by retrying. Fail fast with a pointer to the README section that
              # explains which GitHub setting needs to be changed.
              if grep -qE "error: 403|Permission to .* denied" "$push_err"; then
                rm -f "$push_err"
                echo "" >&2
                echo "Push rejected by GitHub with HTTP 403 (permission denied)." >&2
                echo "Retrying will not help: the authenticated user shown above is" >&2
                echo "not allowed to push to ${branch}." >&2
                echo "" >&2
                echo "See the \"Troubleshooting\" section in README.md for the exact" >&2
                echo "setting to change:" >&2
                echo "  https://github.com/${GITHUB_REPOSITORY}#troubleshooting-none-of-the-actions-can-update-main" >&2
                exit 1
              fi
              rm -f "$push_err"
              echo "Push attempt ${i} failed; rebasing on origin/${branch} and retrying..."
              # Drop any leftover working-tree or untracked changes so that
              # the rebase below does not abort with "cannot rebase: You
              # have unstaged changes." Everything we want to publish has
              # already been committed above, so any remainder is safe to
              # set aside.
              git stash push --include-untracked --quiet -- || true
              git fetch origin "${branch}"
              # Rebase our single doc commit on top of the latest remote state.
              # Prefer our version for the generated docs directory in case of
              # conflicts, since we just rebuilt it.
              if ! git rebase -X ours "origin/${branch}"; then
                echo "Rebase failed; aborting."
                git rebase --abort || true
                exit 1
              fi
              sleep $((i * 5))
            done
            echo "Failed to push after ${attempts} attempts." >&2
            exit 1
          fi
