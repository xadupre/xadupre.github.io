name: DATA yobx size and loc

# Runs on a weekly schedule and can also be triggered manually. Only the
# repository owner (xadupre) is allowed to actually run the build when it is
# triggered manually; any other actor will see the job skipped. Scheduled
# runs always proceed because they are initiated by GitHub itself.
on:
  schedule:
    # Run once a week, Monday at 06:17 UTC. The odd minute avoids the load
    # spikes that happen exactly on the hour, and the hour is offset from
    # the other weekly recording workflows so they do not compete for the
    # same runner slot.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) of xadupre/yet-another-onnx-builder to build"
        required: false
        default: "main"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    # Only the repository owner is allowed to publish documentation, but
    # scheduled runs (initiated by GitHub itself) are always allowed.
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout xadupre.github.io
        uses: actions/checkout@v5
        with:
          path: site
          # Full history so that we can rebase on top of any concurrent
          # commits to the default branch before pushing the rebuilt docs.
          fetch-depth: 0
          # Use a dedicated bot token (when available) so that the push
          # below is allowed to bypass branch protection rules. Falls
          # back to the default ``GITHUB_TOKEN`` when ``BOT_TOKEN`` is
          # not configured.
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout cache data
        uses: actions/checkout@v6
        with:
          repository: xadupre/cache_data
          path: site/cache_data
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CACHE_DATA_SSH_KEY }}

      - name: Checkout yet-another-onnx-builder
        uses: actions/checkout@v6
        with:
          repository: xadupre/yet-another-onnx-builder
          ref: ${{ inputs.ref || 'main' }}
          path: yet-another-onnx-builder

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build yet-another-onnx-builder wheel
        working-directory: yet-another-onnx-builder
        run: |
          # Build the wheel (and source distribution) so that the size of
          # the published artefact can be tracked over time. ``python -m
          # build`` runs the project's standard PEP 517 build front-end in
          # an isolated environment, so no project dependencies need to be
          # installed beforehand.
          python -m build --wheel --outdir dist

      - name: Record yobx wheel size
        working-directory: yet-another-onnx-builder
        run: |
          # Record the size of every wheel produced under dist/ so that the
          # evolution of the published package size can be tracked over
          # time. The data is appended (one CSV row per .whl file) to
          # cache_data/yet-another-onnx-builder/wheel_sizes.csv inside the
          # cache-data checkout so that the "Commit and push cache data" step
          # below publishes it.
          out_dir="${GITHUB_WORKSPACE}/site/cache_data/yet-another-onnx-builder"
          mkdir -p "$out_dir"
          out="${out_dir}/wheel_sizes.csv"
          if [ ! -f "$out" ]; then
            echo "date,commit,size,name" > "$out"
          fi
          date_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit_sha="$(git rev-parse HEAD)"
          found=0
          while IFS= read -r -d '' f; do
            size="$(wc -c < "$f")"
            name="$(basename "$f")"
            echo "${date_iso},${commit_sha},${size},${name}" >> "$out"
            found=1
            echo "Recorded ${name} (${size} bytes) at ${commit_sha}."
          done < <(find dist -maxdepth 1 -type f -name '*.whl' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No wheel found under dist/; nothing to record."
          fi

      - name: Record Python and C++ lines of code
        run: |
          # Count the lines of Python and C++ source code in the
          # yet-another-onnx-builder checkout and append one row per
          # language to cache_data/yet-another-onnx-builder/loc.csv inside
          # the cache-data checkout. The "Commit and push cache data" step
          # below publishes the new rows alongside the wheel sizes.
          python "${GITHUB_WORKSPACE}/site/scripts/record_loc.py" \
            --source-dir "${GITHUB_WORKSPACE}/yet-another-onnx-builder" \
            --output "${GITHUB_WORKSPACE}/site/cache_data/yet-another-onnx-builder/loc.csv"

      - name: Commit and push cache data
        run: |
          built_sha="$(git -C yet-another-onnx-builder rev-parse HEAD)"
          bash site/scripts/commit_cache_data.sh site/cache_data \
            "Update yet-another-onnx-builder size/loc data (from ${built_sha})"
