<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>onnx-light load/save timing history</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="../../logo.svg" />
<style>
html, body { height: 100%; margin: 0; }
body { background:#0d1117; color:#c9d1d9; font-family:sans-serif; padding:1.5em; box-sizing:border-box; }
a { color:#58a6ff; text-decoration:none; }
header { text-align:center; }
h1 { font-size:1.4em; margin:.3em; }
.controls, .chart-wrap, #message { max-width:1100px; margin:1em auto; box-sizing:border-box; }
.controls { display:flex; gap:1em; justify-content:center; flex-wrap:wrap; }
label { color:#8b949e; }
select { margin-left:.4em; background:#161b22; color:#c9d1d9; border:1px solid #30363d; padding:.35em; }
.chart-wrap { background:rgba(22,27,34,.85); border-radius:12px; padding:1em; }
.chart-wrap h2 { text-align:center; font-size:1.1em; margin:.2em 0 .8em; }
.chart-container { position:relative; height:38vh; min-height:280px; }
.message { text-align:center; color:#d29922; padding:2em; }
.hint { color:#8b949e; text-align:center; font-size:.85em; margin-top:.7em; }
</style>
<script src="../../assets/chart-loader.js"></script>
</head>
<body>
<header>
  <div><a href="../../index.html">&larr; back to home</a></div>
  <h1>onnx-light &mdash; load/save timing history</h1>
  <div>Historical results from
    <a href="../../docs/onnx-light/auto_examples_proto/plot_onnx_time.html">plot_onnx_time</a>
  </div>
</header>
<div class="controls">
  <label>scenario <select id="scenario"><option value="All">All</option></select></label>
  <label>metric
    <select id="metric">
      <option value="avg">average</option>
      <option value="median">median</option>
      <option value="max">maximum</option>
      <option value="std">standard deviation</option>
    </select>
  </label>
</div>
<div id="message" class="message">Loading measurements&hellip;</div>
<div id="charts" style="display:none">
<div class="chart-wrap">
  <h2>Load</h2>
  <div class="chart-container"><canvas id="loadChart"></canvas></div>
  <div class="hint">Lower is better. Drag to pan, use the mouse wheel or pinch to zoom, and double-click to reset.</div>
</div>
<div class="chart-wrap">
  <h2>Save</h2>
  <div class="chart-container"><canvas id="saveChart"></canvas></div>
</div>
<div class="chart-wrap">
  <h2>C++</h2>
  <div class="chart-container"><canvas id="cppChart"></canvas></div>
</div>
</div>
<script>
const DATA_URL = "../../cache_data/onnx-light/onnx_time.csv";
const COLORS = ["#ffa657", "#58a6ff", "#3fb950", "#d2a8ff", "#f85149", "#39c5cf", "#dbab09"];
let rows = [];
const charts = {};

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines.shift().split(",");
  return lines.map(line => {
    const values = line.split(",");
    return Object.fromEntries(header.map((name, i) => [name, values[i]]));
  }).filter(row => row.date && row.name);
}

function rowsFor(kind) {
  const scenario = document.getElementById("scenario").value;
  return rows.filter(row => {
    const isCpp = row.name.includes("-cpp");
    const matchesKind = kind === "cpp"
      ? isCpp
      : !isCpp && row.name.startsWith(kind + "/");
    return matchesKind && (scenario === "All" || row.name === scenario);
  });
}

function renderChart(kind) {
  const metric = document.getElementById("metric").value;
  const chartRows = rowsFor(kind);
  const names = [...new Set(chartRows.map(row => row.name))].sort();
  const datasets = names.map((name, index) => ({
    label: name,
    data: chartRows.filter(row => row.name === name).map(row => ({
      x: row.date, y: Number(row[metric]),
    })),
    borderColor: COLORS[index % COLORS.length],
    backgroundColor: COLORS[index % COLORS.length],
    tension: 0.15,
  }));
  if (charts[kind]) charts[kind].destroy();
  charts[kind] = new Chart(document.getElementById(kind + "Chart"), {
    type: "line",
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      parsing: false,
      scales: {
        x: { type:"time", ticks:{color:"#8b949e"}, grid:{color:"rgba(139,148,158,.15)"} },
        y: { title:{display:true,text:"seconds",color:"#8b949e"}, ticks:{color:"#8b949e"}, grid:{color:"rgba(139,148,158,.15)"} },
      },
      plugins: {
        legend: { labels:{color:"#c9d1d9"} },
        zoom: { pan:{enabled:true,mode:"x"}, zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:"x"} },
      },
    },
  });
}

function render() {
  ["load", "save", "cpp"].forEach(renderChart);
}

loadChartJs().then(() => fetch(DATA_URL)).then(response => {
  if (!response.ok) throw new Error("No timing history has been recorded yet.");
  return response.text();
}).then(text => {
  rows = parseCSV(text);
  if (!rows.length) throw new Error("No timing history has been recorded yet.");
  const select = document.getElementById("scenario");
  [...new Set(rows.map(row => row.name))].sort().forEach(name => {
    const option = document.createElement("option");
    option.value = option.textContent = name;
    select.appendChild(option);
  });
  document.getElementById("message").style.display = "none";
  document.getElementById("charts").style.display = "block";
  select.addEventListener("change", render);
  document.getElementById("metric").addEventListener("change", render);
  ["load", "save", "cpp"].forEach(kind => {
    document.getElementById(kind + "Chart").addEventListener("dblclick", () => charts[kind].resetZoom());
  });
  render();
}).catch(error => {
  document.getElementById("message").textContent = error.message;
});
</script>
</body>
</html>
